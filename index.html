<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一封可以走进去的信</title>
<meta name="theme-color" content="#0b0d13">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+QingKe+HuangYou&family=Press+Start+2P&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23171a26'/%3E%3Crect x='4' y='1' width='8' height='6' fill='%23e8934a'/%3E%3Crect x='5' y='3' width='2' height='2' fill='%231e1e2f'/%3E%3Crect x='9' y='3' width='2' height='2' fill='%231e1e2f'/%3E%3Crect x='4' y='7' width='8' height='6' fill='%23f6efe0'/%3E%3Crect x='12' y='5' width='3' height='6' fill='%23e8934a'/%3E%3C/svg%3E">
<style>
/* ============================================================
   表现层样式（当前沿用旧版像素皮肤，之后可整体换肤）
   换视觉 ≠ 改逻辑：逻辑层只认 Assets 语义 ID，不认具体样式。
   ============================================================ */
:root{
  --bg:#0b0d13;
  --panel:#171a26;
  --panel2:#232741;
  --line:#3a4058;
  --ink:#f2e8cf;
  --dim:#8f88ab;
  --gold:#ffd166;
  --accent:#e8934a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;touch-action:manipulation}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Courier New","NSimSun","SimSun",monospace;
  min-height:100vh;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
/* 手机端主布局：场景铺满全屏，对话条浮在底部，顶部 HUD（第N站 / 相册） */
#screen{
  position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;
  background:#0b0d13;
}
#canvaswrap{position:absolute;inset:0;overflow:hidden;background:#171a26}
#scene{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);opacity:.5}
/* ===== 顶部 HUD ===== */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:7;
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  pointer-events:none;
}
#hud .pxbtn{pointer-events:auto}
#station{
  background:rgba(20,24,36,.92);border:2px solid #000;box-shadow:0 0 0 2px #2c3247;
  color:var(--gold);font-size:12px;padding:3px 10px;letter-spacing:2px;
  font-family:monospace;white-space:nowrap;
}
#hudright{display:flex;gap:6px;pointer-events:auto;margin-left:auto}
.pxbtn{
  font-family:inherit;font-size:12px;color:var(--ink);
  background:var(--panel2);border:2px solid #000;
  box-shadow:inset 2px 2px 0 #3a4058,inset -2px -2px 0 #0d0f18;
  padding:2px 9px;cursor:pointer;line-height:1.4;
}
.pxbtn:hover{background:#2b3150}
.pxbtn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.pxbtn:active{transform:translate(1px,1px);box-shadow:inset 2px 2px 0 #0d0f18}
.pxbtn svg{display:block;width:13px;height:13px}

/* ===== 底部对话条（浮在场景上；场景画布止于它的上沿，保证地面物件可见可点） ===== */
#dialogue{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  background:linear-gradient(to top, rgba(12,14,22,.96) 40%, rgba(12,14,22,.84));
  border-top:2px solid #b8864f;
  padding:12px 16px 14px;
  max-height:46%;overflow:hidden;
  cursor:pointer;user-select:none;
  box-shadow:0 -6px 24px rgba(0,0,0,.35);
}
/* 顶部像素虚线装饰 */
#dialogue::before{
  content:"";position:absolute;top:5px;left:16px;right:16px;height:2px;
  background-image:linear-gradient(90deg,#c9a876 50%,transparent 50%);
  background-size:8px 2px;background-repeat:repeat-x;opacity:.4;
}
/* 左上角小像素爱心 */
#dialogue::after{
  content:"❤";position:absolute;top:3px;left:12px;font-size:10px;color:#d48a9a;
  font-family:monospace;
}
.dinner{width:100%;margin:0 auto;position:relative;max-width:560px;padding-top:6px}
#dtext{
  font-size:16px;line-height:1.8;letter-spacing:.4px;color:#f6efe0;
  min-height:40px;max-height:calc(52vh - 92px);overflow-y:auto;
  scrollbar-width:thin;padding-left:44px;
}
#dbar{margin-top:8px;height:4px;background:rgba(255,255,255,.14);border-radius:2px;position:relative}
#dbarfill{height:100%;width:0;background:#e8934a}
#dnext{position:absolute;right:8px;bottom:8px;color:#ffd166;font-size:18px;animation:blink 1s steps(2) infinite;font-weight:bold}
#dprev{position:absolute;left:14px;top:44px;color:#ffd166;font-size:17px;font-weight:bold;cursor:pointer;padding:2px 6px;opacity:.95}
#dprev:active{transform:translateY(1px)}
#hstext{max-height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
#controls{font-size:10px;color:#9a8f7d;margin-top:8px;letter-spacing:1px;text-align:right;padding-right:30px;font-family:monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

#catbubble{
  position:absolute;z-index:6;display:none;transform:translate(-50%,-100%);
  left:50%;top:40%;
  background:#e8f4ff;color:#1a3a5c;border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.45);
  padding:3px 9px;font-size:12px;white-space:nowrap;
}
#catbubble.bubble-item{
  background:#ffffff;color:#333333;
}
#catbubble.show{display:block}
#bingo{
  position:absolute;z-index:6;display:none;transform:translate(-50%,-50%);
  font-size:36px;font-weight:bold;color:var(--gold);letter-spacing:3px;
  font-family:"Press Start 2P","Courier New",monospace;
  text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;
}
@keyframes bingoanim{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}

#wayarrow{
  position:absolute;z-index:5;display:none;transform:translate(-50%,-50%);
  width:28px;height:16px;pointer-events:none;
  animation:arrowblink 0.8s ease-in-out infinite;
}
/* 鱼头：蓝色小圆 */
.fish-head{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;
  background:#6ba3ff;
  box-shadow:0 0 4px #6ba3ff, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
}
/* 鱼骨：横线 */
.fish-bone{
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:18px;height:2px;background:#fff;
  box-shadow:1px 0 0 #000, -1px 0 0 #000;
}
/* 肋骨：小三角（上下各 3 个） */
.fish-rib{
  position:absolute;width:0;height:0;
  border-left:3px solid transparent;
  border-right:3px solid transparent;
}
.fish-rib.r1{ left:12px; top:2px; border-bottom:5px solid #fff; }
.fish-rib.r2{ left:18px; top:2px; border-bottom:5px solid #fff; }
.fish-rib.r3{ left:24px; top:2px; border-bottom:5px solid #fff; }
@keyframes arrowblink{0%,100%{opacity:0.4}50%{opacity:1}}

#scenehint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  background:rgba(20,24,36,.92);border:2px solid #000;box-shadow:0 0 0 2px #2c3247;
  color:var(--gold);font-size:12px;padding:5px 14px;letter-spacing:1px;
  white-space:nowrap;max-width:92%;text-align:center;overflow:hidden;text-overflow:ellipsis;
}
#pad{position:absolute;right:85px;bottom:28%;width:56px;height:56px;z-index:6;display:none;touch-action:none;cursor:grab}
#padball{position:absolute;left:0;top:0;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),rgba(255,255,255,.22));
  border:1.5px solid rgba(255,255,255,.45);
  box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 -3px 6px rgba(0,0,0,.12);
  will-change:transform}
#padring{position:absolute;left:-24px;top:-24px;width:104px;height:104px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);display:none;pointer-events:none;
  box-shadow:0 0 22px rgba(255,255,255,.05)}
#padring.on{display:block}
@media (pointer:coarse){#pad{display:block}}

.overlay{position:absolute;inset:0;z-index:20;background:rgba(7,8,13,.62);display:flex;align-items:center;justify-content:center}
#popup{z-index:30}
.hidden{display:none!important}
.pwin{
  width:min(340px,88%);background:var(--panel);border:3px solid #000;
  box-shadow:inset 3px 3px 0 #0d0f18,inset -3px -3px 0 #2c3247,0 0 0 3px #3a4058,8px 8px 0 rgba(0,0,0,.45);
  padding:0 0 12px;
  max-height:86%;overflow-y:auto;
}
.ptitle{background:#2b3150;color:var(--gold);padding:7px 12px;font-size:13px;letter-spacing:3px;border-bottom:2px solid #000}
#ptpl{display:flex;flex-direction:column;padding:12px 12px 4px}
.pimg{width:100%;border:2px dashed #4a5170;background:#10131c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:12px;letter-spacing:1px}
.pimg img{max-width:100%;max-height:52vh;height:auto;display:block;object-fit:contain}
.picon{width:56px;height:56px;image-rendering:pixelated;border:2px solid #000;background:#171a26}
.pimgnote{margin:8px 0 0;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
.plines{font-size:13px;line-height:1.9;color:var(--ink);margin-top:10px}
#pclose{position:absolute;top:6px;right:10px;cursor:pointer;font-family:monospace;font-size:18px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);line-height:1;padding:2px 4px}
.fwin{width:min(560px,92%);background:var(--panel);border:3px solid #000;box-shadow:inset 3px 3px 0 #0d0f18,inset -3px -3px 0 #2c3247,0 0 0 3px #3a4058,8px 8px 0 rgba(0,0,0,.45);max-height:86%;display:flex;flex-direction:column}
#ftext{flex:1;overflow:auto;padding:14px 16px;font-size:13px;line-height:2;white-space:pre-wrap;color:var(--ink)}
#fclose{margin:10px auto 14px;display:block}
.ewin{width:min(420px,88%);background:var(--panel);border:3px solid #000;box-shadow:inset 3px 3px 0 #0d0f18,inset -3px -3px 0 #2c3247,0 0 0 3px #3a4058,8px 8px 0 rgba(0,0,0,.45);padding:18px;text-align:center}
.ewin p{font-size:14px;line-height:2;color:var(--dim);margin:8px 0 18px}
.ebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* ===== 相册（走过的路 · 收集物回看） ===== */
.awin{
  width:min(340px,90%);background:var(--panel);border:3px solid #000;
  box-shadow:inset 3px 3px 0 #0d0f18,inset -3px -3px 0 #2c3247,0 0 0 3px #3a4058,8px 8px 0 rgba(0,0,0,.45);
  max-height:84%;overflow-y:auto;padding:0 0 14px;
}
.awin .ptitle{display:flex;align-items:center;justify-content:space-between}
#aclose{cursor:pointer;font-family:monospace;font-size:18px;color:#fff;line-height:1;padding:2px 6px}
.asec{font-size:11px;color:var(--dim);letter-spacing:2px;margin:14px 12px 6px;font-family:monospace}
#alist{padding:0 12px;display:flex;flex-direction:column;gap:6px}
.arow{
  display:flex;align-items:center;justify-content:space-between;
  background:#1b1f30;border:2px solid #000;padding:6px 10px;font-size:12px;color:var(--ink);
}
.arow.cur{border-color:#b8864f;color:var(--gold)}
.arow .aname{letter-spacing:1px}
.arow .astat{font-size:10px;color:var(--dim);font-family:monospace}
.arow.cur .astat{color:#e8934a}
#agrid{padding:0 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acell{
  background:#1b1f30;border:2px solid #000;padding:8px 4px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10px;color:var(--ink);font-family:inherit;text-align:center;
}
.acell canvas{width:44px;height:44px;image-rendering:pixelated}
.acell:hover{border-color:#3a4058}
.acell.miss{opacity:.38;cursor:default}
.acell.miss:hover{border-color:#000}
#afull{display:block;margin:14px auto 0;padding:4px 14px}

/* 电脑端不重点适配：居中一个手机宽度的框即可 */
@media (min-width:640px){
  body{display:flex;align-items:center;justify-content:center;background:#0b0d13;}
  #screen{width:min(420px,100vw);height:100vh;height:100dvh;box-shadow:0 0 0 2px #2c3247,0 0 60px rgba(0,0,0,.55);}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
/* ===== 开屏片头 ===== */
#splash{position:absolute;inset:0;z-index:300;background:#000;display:flex;align-items:center;justify-content:center}
#splash video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#splash_skip{position:absolute;top:14px;right:16px;z-index:3;cursor:pointer;font-family:monospace;font-size:14px;color:#faf3e3;background:rgba(0,0,0,.45);border:1px solid rgba(250,243,227,.5);border-radius:6px;padding:6px 12px;letter-spacing:1px}
#splash_sound{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:3;cursor:pointer;font-family:monospace;font-size:13px;color:#faf3e3;background:rgba(0,0,0,.55);border:1px solid rgba(250,243,227,.55);border-radius:20px;padding:8px 18px;letter-spacing:1px}
#splash_ctrl{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:3;width:82%;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.45);border:1px solid rgba(250,243,227,.35);border-radius:8px;padding:8px 12px}
#splash_pause{background:none;border:none;cursor:pointer;font-size:16px;color:#faf3e3;line-height:1;padding:0 4px;flex:0 0 auto;font-family:monospace}
.sp_playbar{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:3px;cursor:pointer;position:relative}
#splash_prog{position:absolute;left:0;top:0;height:100%;width:0;background:#e0c188;border-radius:3px}
#splash_vload{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;width:62%;text-align:center}
#sv_fill{height:100%;width:0;background:linear-gradient(90deg,#c9a876,#e0c188);transition:width .3s}
#sv_text{font-family:monospace;font-size:12px;color:#faf3e3;letter-spacing:1px;margin-top:8px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#splash_progress{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);z-index:3;width:70%;text-align:center}
.sp_bar{height:12px;background:rgba(0,0,0,.5);border:2px solid #3a4058;border-radius:6px;overflow:hidden}
#sp_fill{height:100%;width:0;background:linear-gradient(90deg,#c9a876,#e0c188);transition:width .3s}
#sp_text{font-family:monospace;font-size:12px;color:#faf3e3;letter-spacing:1px;margin-top:8px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div id="screen">
  <div id="canvaswrap">
    <canvas id="scene" width="480" height="288"></canvas>
    <div id="scanlines"></div>
    <div id="hud">
      <div id="station">第1站</div>
      <div id="hudright">
        <button id="btnAlbum" class="pxbtn" type="button">相册</button>
        <button id="btnMute" class="pxbtn" type="button" aria-label="声音开关">
          <svg id="icoOn" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 6v4h3l4 3V3L5 6H2z"/><path d="M11 5.5a3 3 0 0 1 0 5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
          <svg id="icoOff" class="hidden" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 6v4h3l4 3V3L5 6H2z"/><line x1="10" y1="5" x2="14" y2="11" stroke="currentColor" stroke-width="1.6"/><line x1="14" y1="5" x2="10" y2="11" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
      <!-- 音量控制面板 -->
      <div id="volumePanel" style="position:absolute;top:50px;right:10px;background:#fff;border:2px solid #3a2d22;border-radius:8px;padding:10px;z-index:100;display:none;min-width:150px;">
        <div style="font-family:monospace;font-size:12px;color:#3a2d22;margin-bottom:8px;">音量设置</div>
        <div style="margin-bottom:8px;">
          <div style="font-family:monospace;font-size:10px;color:#666;margin-bottom:4px;">音效</div>
          <input type="range" id="sfxVolume" min="0" max="100" value="50" style="width:100%;">
        </div>
        <div>
          <div style="font-family:monospace;font-size:10px;color:#666;margin-bottom:4px;">音乐</div>
          <input type="range" id="musicVolume" min="0" max="100" value="30" style="width:100%;">
        </div>
      </div>
    </div>
    <div id="catbubble"></div>
    <div id="bingo">BINGO!</div>
    <div id="wayarrow">
      <div class="fish-head"></div>
      <div class="fish-bone"></div>
      <div class="fish-rib r1"></div>
      <div class="fish-rib r2"></div>
      <div class="fish-rib r3"></div>
    </div>
    <!-- ===== 顶部记忆提示条 ===== -->
    <div id="scenehint" class="hidden"></div>
    <!-- ===== 触屏十字键（手机端） ===== -->
    <!-- 浮球移动键（半透明小球，按住向任意方向拖，出现半透明圆环指示） -->
    <div id="pad">
      <div id="padring"></div>
      <div id="padball"></div>
    </div>
    <!-- ===== 记忆弹窗（内容由模板渲染，结构可变） ===== -->
    <div id="popup" class="overlay hidden">
      <div class="pwin" style="position:relative;">
        <div class="ptitle">▌ <span></span></div>
        <div id="ptpl"></div>
        <span id="pclose">×</span>
      </div>
    </div>
    <!-- ===== 完整信件 ===== -->
    <div id="fullletter" class="overlay hidden">
      <div class="fwin">
        <div class="ptitle">▌ 完整的一封信</div>
        <div id="ftext"></div>
        <button id="fclose" class="pxbtn" type="button">[ 关闭 ]</button>
      </div>
    </div>
    <!-- ===== 结尾 ===== -->
    <div id="ending" class="overlay hidden">
      <div class="ewin" style="max-width: 400px;">
        <div class="ptitle" style="text-align:center">▌ 信，读完了</div>
        <video id="end_video" src="assets/maps/map_end.mp4" style="width:100%; border-radius:8px; margin: 12px 0;" loop playsinline></video>
        <p>也许你忘了的，我还记得。</p>
        <div class="ebtns">
          <button id="eLetter" class="pxbtn" type="button">再看一遍完整的信</button>
          <button id="eAgain" class="pxbtn" type="button">回到开头</button>
        </div>
      </div>
    </div>
    <!-- ===== 相册（走过的路 · 收集物回看） ===== -->
    <div id="album" class="overlay hidden">
      <div class="awin">
        <div class="ptitle"><span>▌ 相册 · 走过的路</span><span id="aclose">×</span></div>
        <!-- 两个 tab -->
        <div style="display:flex;gap:8px;padding:8px 12px;">
          <button id="tabExplore" class="pxbtn" type="button" style="flex:1;">可探索</button>
          <button id="tabDialog" class="pxbtn" type="button" style="flex:1;">对白</button>
        </div>
        <!-- 可探索 tab 内容 -->
        <div id="tabExploreContent">
          <div class="asec">· 站</div>
          <div id="alist"></div>
          <div class="asec">· 收集的小玩意儿</div>
          <div id="agrid"></div>
        </div>
        <!-- 对白 tab 内容 -->
        <div id="tabDialogContent" style="display:none;">
          <div id="dlist" style="padding:12px;display:flex;flex-direction:column;gap:12px;"></div>
        </div>
        <button id="afull" class="pxbtn" type="button">完整的一封信</button>
        <button id="aend" class="pxbtn" type="button" style="margin-top:8px;background:#ffd0e0;">实在找不到的话也没关系哦，可以先来查看最终彩蛋</button>
      </div>
    </div>
    <!-- ===== 热区对白弹窗（白底小气泡，固定画面居中，最多两行） ===== -->

我们不再需要一个特殊的日子才能庆祝。所以准备好了吗？我来带你看看我们还记得些什么。

那天我问你，我们第一次见面说的话是什么，你还记得吗？

其实我也不记得了。

但我记得你第一次，是在初一的语文课上。那个时候你刚转学来，印象中穿着蓝色的牛仔裙衫，下面是条红棕色的铅笔裤？

那天，课文朗诵朗读的环节，你的角色是羚羊木雕里万芳的妈妈，我是万芳。小时候心里别别扭扭的，隔了很久也记得这种感觉。

但什么时候真正意识到，原来我们是那样好的朋友呢？

我想：我同样因为你明白了：人并非不能爱人，人们只是太期待得到爱，从而在爱与被爱里进退两难。

但你向来大胆，对你喜欢的从来都是尽全力争取，也从不担心落空。正大光明的给世界你的爱，也正大光明的受伤，然后站起来继续往前走。

哪怕至今我也不懂这个字意味着什么，但我想我从你身上得到的爱，让我对世界变得挑剔，却也忘记了。你总是勇敢的决定让任何人该出现在你生命的哪个位置，然后像苏格拉底的稻穗一样，闭上眼睛穿过整个稻田。

我想我总有一种幻觉：逃离熟悉的一切，从头开始，这像对另一种安全的渴望，像是更强大、更自洽、更游刃有余、更平和，然后才能建立起良好的关系。

在一个全新的副本里，没有人认识曾经的我。那个我有什么好的呢？她有那么多缺点，她什么都不会，她根本没有成长起来。

可是好像成为你的朋友的时候，我就是不够好的。

所以人不是因为完美才被爱的。我们接纳的或许就是那个不够好的，有很多缺点，但依然值得被好好对待的彼此吧。

但我仍然要将爱从爱情的字典里拯救出来。

礼物没什么惊喜的，但希望它能替我陪着你。

另外呢，如果有一天你忘记了你曾经多么勇敢，教会别人爱、自信与勇气。

我想...

你可以从我这里取走一些。

/* ================= SRC: ASSETS（素材接口：逻辑只认语义 ID，绝不写死文件名） =================
   kind 类型约定（素材接口，未全部实现）：
     image      静态图 / GIF：浏览器直接播放          —— 已实现
     sprite     Sprite Sheet：按 frameW/frameH 切帧   —— 已实现
     procedural 程序生成（无素材时的兜底）            —— 已实现
     sequence   多帧图循环（rain_01.png ...）         —— 接口预留
     video      WebM/MP4 循环背景                     —— 接口预留
   新增类型只需在 register 登记 + 在 load/draw 加对应分支，逻辑层零改动。 */
var Assets = (function () {
  var registry = {}, loaded = {};

  function register(spec) {
    if (!spec || !spec.id) { return; }
    registry[spec.id] = spec;
    loaded[spec.id] = undefined;
  }
  function get(id) { return registry[id] || null; }
  function has(id) { return !!registry[id]; }
  function load(id, onDone) {
    var spec = registry[id];
    if (!spec) { if (onDone) { onDone(null); } return; }
    if (loaded[id] !== undefined) { if (onDone) { onDone(loaded[id]); } return; }
    if (spec.kind === "sequence" || spec.kind === "video") {
      loaded[id] = null;                       // 接口预留：暂不加载
      if (onDone) { onDone(null); }
      return;
    }
    if (spec.kind === "procedural" || !spec.src) {
      loaded[id] = null;                       // 无素材 → 程序化兜底
      if (onDone) { onDone(null); }
      return;
    }
    var img = new Image();
    img.onload = function () { loaded[id] = img; if (onDone) { onDone(img); } };
    img.onerror = function () { loaded[id] = null; if (onDone) { onDone(null); } };
    img.src = spec.src;
  }
  function image(id) {
    var i = loaded[id];
    return (i === undefined || i === null) ? null : i;
  }
  function isLoaded(id) { return loaded[id] !== undefined && loaded[id] !== null; }
  /* 通用绘制：image/gif 直接画；sprite 按帧切。返回 false 表示无图（调用方画程序化兜底）。 */
  function draw(ctx, id, dx, dy, dw, dh, frame, flipH) {
    var spec = registry[id], img = image(id);
    if (!spec || !img) { return false; }
    if (spec.kind === "sprite") {
      var cols = spec.frames ? spec.frames[0] : 1;
      var fw = spec.frameW || Math.floor(img.width / cols);
      var fh = spec.frameH || Math.floor(img.height / (spec.frames ? spec.frames[1] : 1));
      var f = frame || 0;
      var sx = (f % cols) * fw, sy = Math.floor(f / cols) * fh;
      if (flipH) {
        ctx.save();
        ctx.translate(dx + dw, dy);
        ctx.scale(-1, 1);
        ctx.drawImage(img, sx, sy, fw, fh, 0, 0, dw, dh);
        ctx.restore();
      } else {
        ctx.drawImage(img, sx, sy, fw, fh, dx, dy, dw, dh);
      }
    } else {
      ctx.drawImage(img, dx, dy, dw, dh);
    }
    return true;
  }
  return { register: register, get: get, has: has, load: load, image: image, isLoaded: isLoaded, draw: draw };
})();

/* ================= SRC: SCENE CORE（数据层：碰撞 / 出生点 / 触发区，纯逻辑不碰视觉） ================= */
var SceneCore = (function () {
  var S = SCENES.classroom;
  var TILE = S.visual.tileW;
  var grid = S.data.grid;
  var W = grid[0].length, H = grid.length;
  var solid = S.data.solid;
  function tileAt(tx, ty) { if (tx < 0 || ty < 0 || tx >= W || ty >= H) { return "#"; } return grid[ty][tx]; }
  function isSolid(t) { return solid.indexOf(t) !== -1; }
  function collides(px, py, r) {
    var pts = [[px - r, py - r], [px + r, py - r], [px - r, py + r], [px + r, py + r]];
    for (var i = 0; i < 4; i++) {
      var tx = Math.floor(pts[i][0] / TILE), ty = Math.floor(pts[i][1] / TILE);
      if (isSolid(tileAt(tx, ty))) { return true; }
    }
    return false;
  }
  function zone(id) {
    var zs = S.data.triggerZones;
    for (var i = 0; i < zs.length; i++) { if (zs[i].id === id) { return zs[i]; } }
    return null;
  }
  function zoneRect(id) {
    var z = zone(id);
    if (!z) { return null; }
    return { x: z.x * TILE, y: z.y * TILE, w: z.w * TILE, h: z.h * TILE };
  }
  function spawn() { return S.data.spawn; }
  return { TILE: TILE, W: W, H: H, collides: collides, zone: zone, zoneRect: zoneRect, spawn: spawn };
})();

/* ================= SRC: MAP RENDERER（表现层：整图素材优先，无图回退程序化瓦片） ================= */
var MapRenderer = (function () {
  var S = SCENES.classroom;
  var currentAssetId = S.visual.assetId;
  var C = {
    floorA: "#333048", floorB: "#2d2a42", wall: "#4d4a6a", wallDark: "#3c3952",
    sky: "#86b9d8", frame: "#57537a", board: "#2c5e52", boardFrame: "#3d3a5c",
    chalk: "#d9e6d2", desk: "#7a4a26", deskTop: "#8f5a30", deskDark: "#5f3a1f",
    deskLeg: "#4a2d17", book: "#b23a3a", bookPage: "#f6efe0", bookSpine: "#8e2c2c"
  };
  function pxRect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

  function switchScene(assetId) {
    currentAssetId = assetId;
    if (assetId && !Assets.isLoaded(assetId)) { Assets.load(assetId); }
    /* 先停止所有视频 */
    ["map_rain", "map_escape"].forEach(function(vid) {
      var el = document.getElementById("bg_video_" + vid);
      if (el) { el.pause(); }
    });
    /* 视频背景：切换到下雨/逃离场景时手动播放 */
    if (assetId === "map_rain" || assetId === "map_escape") {
      var video = document.getElementById("bg_video_" + assetId);
      if (video) {
        video.volume = 0.02;
        video.play().catch(function(e) { console.log("video play error:", e); });
      }
    }
  }

  function draw(ctx, time, activeZoneId) {
    var assetId = currentAssetId;
    var r = Camera.rect();
    /* 视频背景：map_rain / map_escape 用 video 代替图片 */
    if (assetId === "map_rain" || assetId === "map_escape") {
      var video = document.getElementById("bg_video_" + assetId);
      if (video && video.readyState >= 2) {
        var iw = video.videoWidth, ih = video.videoHeight;
        var sx = r.x / (SceneCore.W * SceneCore.TILE) * iw;
        var sy = r.y / (SceneCore.H * SceneCore.TILE) * ih;
        var sw = r.w / (SceneCore.W * SceneCore.TILE) * iw;
        var sh = r.h / (SceneCore.H * SceneCore.TILE) * ih;
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, ctx.canvas.width, ctx.canvas.height);
        drawZoneGlow(ctx, time, activeZoneId);
        return;
      }
    }
    var img = assetId ? Assets.image(assetId) : null;
    if (img) {
      /* 镜头窗口对应到图片上的源区域，画满画布（宽屏退化为整图）；画布比例跟随屏幕，显示等比不拉伸 */
      var iw = img.width, ih = img.height;
      var sx = r.x / (SceneCore.W * SceneCore.TILE) * iw;
      var sy = r.y / (SceneCore.H * SceneCore.TILE) * ih;
      var sw = r.w / (SceneCore.W * SceneCore.TILE) * iw;
      var sh = r.h / (SceneCore.H * SceneCore.TILE) * ih;
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, ctx.canvas.width, ctx.canvas.height);
    } else {
      /* 程序化瓦片：按镜头平移缩放绘制 */
      ctx.save();
      var scx = ctx.canvas.width / r.w, scy = ctx.canvas.height / r.h;
      ctx.setTransform(scx, 0, 0, scy, -r.x * scx, -r.y * scy);
      drawTiles(ctx);
      ctx.restore();
    }
    drawZoneGlow(ctx, time, activeZoneId);
  }

  function drawTiles(ctx) {
    for (var ty = 0; ty < SceneCore.H; ty++) {
      for (var tx = 0; tx < SceneCore.W; tx++) { drawTile(ctx, tx, ty); }
    }
  }
  function drawTile(ctx, tx, ty) {
    var t = S.data.grid[ty][tx], x = tx * SceneCore.TILE, y = ty * SceneCore.TILE;
    switch (t) {
      case ".":
        pxRect(ctx, x, y, SceneCore.TILE, SceneCore.TILE, ((tx + ty) % 2) ? C.floorA : C.floorB);
        break;
      case "#":
        pxRect(ctx, x, y, SceneCore.TILE, SceneCore.TILE, C.wall);
        pxRect(ctx, x, y + SceneCore.TILE - 3, SceneCore.TILE, 3, C.wallDark);
        pxRect(ctx, x, y, 2, SceneCore.TILE, C.wallDark);
        break;
      case "W":
        pxRect(ctx, x, y, SceneCore.TILE, SceneCore.TILE, C.frame);
        pxRect(ctx, x + 2, y + 2, SceneCore.TILE - 4, SceneCore.TILE - 4, C.sky);
        pxRect(ctx, x + 6, y + 2, 2, SceneCore.TILE - 4, C.frame);
        pxRect(ctx, x + 2, y + 7, SceneCore.TILE - 4, 2, C.frame);
        break;
      case "B":
        pxRect(ctx, x, y, SceneCore.TILE, SceneCore.TILE, C.board);
        pxRect(ctx, x, y, SceneCore.TILE, 2, C.boardFrame);
        if ((tx * 7 + ty * 13) % 5 === 0) { pxRect(ctx, x + 3, y + 5, 7, 1, C.chalk); }
        break;
      case "D": drawDesk(ctx, x, y, false); break;
      case "T": drawDesk(ctx, x, y, true); break;
    }
  }
  function drawDesk(ctx, x, y, hasBook) {
    pxRect(ctx, x, y, SceneCore.TILE, 6, C.desk);
    pxRect(ctx, x, y + 1, SceneCore.TILE, 2, C.deskTop);
    pxRect(ctx, x, y + 6, SceneCore.TILE, 6, C.deskDark);
    pxRect(ctx, x + 2, y + 12, 2, 4, C.deskLeg);
    pxRect(ctx, x + 12, y + 12, 2, 4, C.deskLeg);
    if (hasBook) {
      pxRect(ctx, x + 4, y + 1, 10, 7, C.book);
      pxRect(ctx, x + 4, y + 2, 10, 2, C.bookPage);
      pxRect(ctx, x + 4, y + 5, 10, 1, C.bookSpine);
      pxRect(ctx, x + 9, y + 1, 1, 7, C.bookSpine);
    }
  }
  function drawZoneGlow(ctx, time, zoneId) {
    if (!zoneId) { return; }
    var zr = SceneCore.zoneRect(zoneId);
    if (!zr) { return; }
    if (!Camera.inView(zr.x + zr.w / 2, zr.y + zr.h / 2, 40)) { return; }
    var tl = Camera.toCanvas(zr.x, zr.y), br = Camera.toCanvas(zr.x + zr.w, zr.y + zr.h);
    var w = br.x - tl.x, h = br.y - tl.y;
    var a = 0.35 + 0.3 * Math.sin(time * 5);
    pxRect(ctx, tl.x - 4, tl.y - 4, w + 8, h + 8, "rgba(255,209,102," + (a * 0.4).toFixed(2) + ")");
    pxRect(ctx, tl.x - 2, tl.y - 2, w + 4, h + 4, "rgba(255,209,102," + a.toFixed(2) + ")");
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 12px monospace";
    ctx.fillText("!", tl.x + w / 2 - 3, tl.y - 6);
  }
  return { draw: draw, switchScene: switchScene, get currentAssetId() { return currentAssetId; } };
})();

    intro.fx = x; intro.fy = SceneCore.H * SceneCore.TILE + 60;  // 从黑色底框下方跳进

      else { dir = 0; }                   // 上下走 → 正面

      if (!SceneCore.collides(nx, y, 5)) { x = nx; }
      var ny = y + vy * SPEED * dt;
      if (!SceneCore.collides(x, ny, 5)) { y = ny; }

      dir = 0;                              // 不操作 → 正面朝我
    }

    if (moving && !wasMoving && Math.random() < 0.15) {

/* ================= SRC: CHARACTER RENDERER（表现层：Sprite Sheet 优先，无图回退程序化小猫） ================= */
var CharacterRenderer = (function () {
  var ASSET_ID = "player_cat";
  var P = { body: "#e8934a", cream: "#f6efe0", pink: "#f2a2b0", dark: "#2b2b3d" };

  function draw(ctx, st, time) {
    var w = 16, h = 16;
    /* 世界坐标 → 画布坐标（镜头窗口换算），否则小猫走到世界右半边就出画 */
    var c = Camera.toCanvas(st.x, st.y);
    if (Assets.isLoaded(ASSET_ID) && Assets.image(ASSET_ID)) {
      var spec = Assets.get(ASSET_ID);
      if (spec.size) { w = spec.size[0]; h = spec.size[1]; }
      /* dirFrames: 每方向一个帧索引数组。
         站立时用该方向首帧；移动时按 fps 循环。 */
      var dirFrames = spec.dirFrames || { 0: [0], 1: [0], 2: [0], 3: [0] };
      var arr = dirFrames[st.dir] || dirFrames[0];
      var idx = st.moving ? arr[Math.floor(time * (spec.fps || 8)) % arr.length] : arr[0];
      /* sheet 里只有朝左帧，右走时水平翻转 */
      var flipH = (st.dir === 2);
      Assets.draw(ctx, ASSET_ID, Math.round(c.x - w / 2), Math.round(c.y - h / 2), w, h, idx, flipH);
      return;
    }
    drawFallback(ctx, c.x, c.y, st.dir, st.moving, time);
  }

  function drawFallback(ctx, x, y, dir, moving, time) {
    var bob = (moving && Math.floor(time * 4.5) % 2 === 1) ? 1 : 0;
    function px(ox, oy, pw, ph, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(x - 8 + ox), Math.round(y - 8 + oy), pw, ph); }
    if (dir === 2 || dir === 3) {
      px(dir === 2 ? 1 : 13, 5 + bob, 3, 7, P.body);
      px(dir === 2 ? 1 : 13, 11 + bob, 3, 2, "#1e1e2f");
    } else {
      px(12, 6 + bob, 3, 6, P.body);
      px(12, 11 + bob, 3, 2, "#1e1e2f");
    }
    px(4, 7 + bob, 8, 8, P.body);
    px(5, 10 + bob, 6, 5, P.cream);
    var ly = 13 + bob;
    if (moving && Math.floor(time * 4.5) % 2 === 1) {
      px(5, ly - 1, 2, 3, P.cream); px(9, ly, 2, 3, P.cream);
    } else {
      px(5, ly, 2, 3, P.cream); px(9, ly - 1, 2, 3, P.cream);
    }
    px(4, 0 + bob, 8, 7, P.body);
    px(4, 1 + bob, 1, 1, P.pink); px(11, 1 + bob, 1, 1, P.pink);
    if (dir === 1) {
      px(6, 2 + bob, 4, 4, P.body);
    } else {
      px(5, 3 + bob, 2, 2, P.dark); px(9, 3 + bob, 2, 2, P.dark);
      px(5, 3 + bob, 1, 1, "#fff"); px(9, 3 + bob, 1, 1, "#fff");
      px(7, 5 + bob, 2, 1, P.pink);
      px(6, 6 + bob, 1, 1, P.dark); px(9, 6 + bob, 1, 1, P.dark);
    }
  }
  return { draw: draw };
})();

/* ================= SRC: CAMERA（镜头：手机竖屏下世界比屏幕大，镜头跟随小猫，
   露出世界的一个窗口。所有画布绘制 / 点击 / 浮层定位都经它换算，宽屏则退化为全览。） ================= */
var Camera = (function () {
  var WORLD_W = 480, WORLD_H = 288;   // 逻辑世界尺寸（与 SceneCore 一致）
  function wrapSize() {
    var w = document.getElementById("canvaswrap");
    var cw = w ? w.clientWidth : 0, ch = w ? w.clientHeight : 0;
    if (!cw || !ch) { return { w: 390, h: 600 }; }
    return { w: cw, h: ch };
  }
  /* 当前可见窗口（逻辑世界坐标），跟随猫并钳制在世界边界内 */
  function rect() {
    var ws = wrapSize(), a = ws.w / ws.h;
    var lw = WORLD_H * a, lh = WORLD_H;
    if (lw > WORLD_W) { lw = WORLD_W; lh = WORLD_W / a; }   // 宽屏：看全宽
    var p = Player.state();
    var lx = Math.max(0, Math.min(WORLD_W - lw, p.x - lw / 2));
    var ly = Math.max(0, Math.min(WORLD_H - lh, p.y - lh / 2));
    return { x: lx, y: ly, w: lw, h: lh };
  }
  /* 画布逻辑尺寸（随屏幕比例变化，保证显示等比不拉伸） */
  function logical() {
    var c = document.getElementById("scene");
    return { w: c ? c.width : 480, h: c ? c.height : 288 };
  }
  /* 世界坐标 → 画布逻辑坐标（画布尺寸动态，与镜头窗口 1:1 对应） */
  function toCanvas(lx, ly) {
    var r = rect(), L = logical();
    return { x: (lx - r.x) / r.w * L.w, y: (ly - r.y) / r.h * L.h };
  }
  /* 世界坐标 → 视口比例（0~1，用于 DOM 浮层定位） */
  function toScreen(lx, ly) {
    var r = rect();
    return { x: (lx - r.x) / r.w, y: (ly - r.y) / r.h };
  }
  /* 画布坐标 → 世界坐标（点击命中用） */
  function toWorld(cx, cy) {
    var r = rect(), L = logical();
    return { x: r.x + (cx / L.w) * r.w, y: r.y + (cy / L.h) * r.h };
  }
  function inView(lx, ly, pad) {
    var r = rect();
    return lx >= r.x - pad && lx <= r.x + r.w + pad && ly >= r.y - pad && ly <= r.y + r.h + pad;
  }
  return { rect: rect, toCanvas: toCanvas, toScreen: toScreen, toWorld: toWorld, inView: inView, logical: logical, WORLD_W: WORLD_W, WORLD_H: WORLD_H };
})();

/* ================= SRC: DIALOGUE（信件推进：分段 + 打字机 + 触发分发，逻辑不变） ================= */
var Dialogue = (function () {
  var segs = LETTER.segments, index = 0, typing = false, timer = null;
  var waiting = null; /* 当前等待的热区 id，玩家收集完后解除 */
  var textEl, barEl, nextEl;
  function init() {
    textEl = document.getElementById("dtext");
    barEl = document.getElementById("dbarfill");
    nextEl = document.getElementById("dnext");
  }
  function start() {
    /* 测试跳转：URL #seg=N 直接跳到第 N 段 */
    var m = window.location.hash.match(/seg=(\d+)/);
    index = m ? Math.min(parseInt(m[1]), segs.length - 1) : 0;
    /* 跳转时重置所有状态（热区/掉落物/礼物盒/记忆收集） */
    Hotspots.reset();
    MemoryDrop.reset();
    GiftBox.reset();
    Triggers.reset();
    /* 跳转时往前找最近的 scene，强制切换场景（避免 currentAssetId 错） */
    for (var i = index; i >= 0; i--) {
      if (segs[i].scene) {
        MapRenderer.switchScene(segs[i].scene.asset);
        Station.applyScene(segs[i].scene.asset, segs[i].scene.aspect);
        break;
      }
    }
    show();
  }
  function show() {
    if (index >= segs.length) {
      /* 检查是不是所有热区都收集完了 */
      if (Hotspots.allCollected()) {
        Ending.show();
      } else {
        /* 没有收集完，提醒他倒回去找 */
        Bubble.show("还有一些回忆没有找到，\n倒回去看看吧...（实在找不到的话，可以在相册里直接查看最终彩蛋）", null, null, 5000, "item");
      }
      return;
    }
    var s = segs[index];
    clearInterval(timer);
    textEl.textContent = "";
    nextEl.style.display = "none";
    waiting = null;
    /* 非记忆段：自动收起上一个记忆的提示条（切场景后不残留） */
    if (!s.memory) { SceneHint.hide(); }
    typing = true;
    var i = 0;
    timer = setInterval(function () {
      i++;
      textEl.textContent = s.text.slice(0, i);
      if (i >= s.text.length) {
        clearInterval(timer); typing = false;
        onTyped();
      }
    }, 26);
    barEl.style.width = (((index + 1) / segs.length) * 100).toFixed(1) + "%";
    /* 场景切换：读到带 scene 的段，换背景图 + 更新站标 + 画布比例；
       同时强制清场上一个场景的所有残留（对白气泡/掉落物/提示条），不跨场景 */
    if (s.scene) {
      Hotspots.forceClose();
      MemoryDrop.reset();
      GiftBox.reset();
      SceneHint.hide();
      Bubble.hide();
      Popup.close(); /* 切场景的时候，自动关掉所有弹窗 */
      Hotspots.reset(); /* 切场景重置热区状态 */
      CatDialog.reset(); /* 切场景重置黑猫对白状态 */
      MapRenderer.switchScene(s.scene.asset);
      Station.applyScene(s.scene.asset, s.scene.aspect);
      /* 下雨场景：先出视频，然后出第二张图（memory_rain_letter） */
      if (s.scene.asset === "map_rain") {
        /* 只弹一次：如果已经收集过了，就不要再弹了 */
        if (!Triggers.isCollected("memory_rain_letter")) {
          setTimeout(function() {
            /* 先弹 memory_rain_letter（带蓝框框的照片） */
            Popup.open(MEMORIES["memory_rain_letter"], function() {
              Triggers.markCollected("memory_rain_letter");
              /* 关掉后再弹 memory_rain（第一张照片） */
              if (!Triggers.isCollected("memory_rain")) {
                setTimeout(function() {
                  Popup.open(MEMORIES["memory_rain"], function() {
                    Triggers.markCollected("memory_rain");
                  });
                }, 1000);
              }
            });
          }, 2000);
        }
      }
    }
    triggerMemory(s);
  }
  function onTyped() {
    var s = segs[index];
    /* 暂停点：等玩家探索对应热区（物件闪光 + 👇手指，点物件→弹窗→关闭→继续） */
    if (s.pauseAt && !Hotspots.isCollected(s.pauseAt)) {
      waiting = s.pauseAt;
      nextEl.style.display = "none";
      Bubble.show("跟我来", 2500);
      Hotspots.highlightOnly(s.pauseAt);

    }

  }

    if (!s.memory) { return; }
    var m = MEMORIES[s.memory]; if (!m) { return; }
    if (Triggers.isCollected(m.id)) { return; }
    var pr = m.presentation;
    if (m.trigger.type === "direct") {
      /* 直接弹出（开场语音播放器等），不走掉落物 */
      Popup.open(m, function () {
        Triggers.markCollected(m.id);
        Dialogue.resume();
      });
    } else if (m.trigger.type === "scene") {
      Triggers.activateScene(m.id);
      /* 不再用顶部提示条，改成小猫说一句引导语（锚小猫头顶） */
      Bubble.show(pr.hintText || "好像有什么在发光…去看看？", null, null, 3200);
    } else if (m.trigger.type === "drop") {
      /* 礼物盒特殊：用 GiftBox 模块（气球放飞） */
      if (m.id === "memory_gift") {
        var ps = Player.state();
        /* 礼物盒放小猫右边远一点的位置，引导小猫跑过去 */
        GiftBox.spawn(ps.x + 120, ps.y);

  }
  function advance() {
    if (index >= segs.length) { return; }
    if (waiting) { return; } /* 等待探索中，不推进 */
    if (MemoryDrop.isActive && MemoryDrop.isActive()) { return; } /* 掉落物还在，不推进 */
    if (GiftBox.isActive && GiftBox.isActive()) { return; } /* 礼物盒还打开，不推进 */
    if (typing) { finishType(); AudioManager.click(); return; }
    /* 推进就收：信件往下走时，自动收掉场上残留（掉落物/气泡/热区弹窗） */
    MemoryDrop.reset();
    Bubble.hide();
    Hotspots.forceClose();
    index++;
    show();
    AudioManager.click();
  }
  /* 回退上一句（纠错用）：暂停等待中不回退；正在打字则直接跳过当前句回到上一句 */
  function back() {
    if (index <= 0 || waiting) { return; }
    if (typing) { finishType(); }
    index--;
    show();
    AudioManager.click();
  }
  /* Hotspots 收集完对应热区后调用：解锁信件 */
  function resume(hotspotId) {
    if (waiting === hotspotId) {
      waiting = null;
      Hotspots.highlightOnly(null);
      nextEl.style.display = "block";
    }
  }
  return { init: init, start: start, advance: advance, back: back, resume: resume, currentIndex: function () { return index; }, typing: function () { return typing; }, currentWaiting: function () { return waiting; } };
})();

/* ================= SRC: MEMORY DROP（掉落物理不变；物件渲染走 Assets + 镜头换算，无图回退程序化图标） ================= */
var MemoryDrop = (function () {
  var item = null, bingoEl;
  function init() { bingoEl = document.getElementById("bingo"); }
  function spawn(mem) {
    if (item) { return; }
    /* 掉在当前镜头画面的居中底部（保证在视野里，必点剧情物品一定能看到） */
    var cam = Camera.rect();
    var x = cam.x + cam.w / 2; /* 当前镜头的水平居中 */
    var targetY = cam.y + cam.h - 60; /* 当前镜头底部往上 60 像素（再往下挪一点） */
    /* 从上面掉下来：初始 y 在目标上方 80 像素 */
    item = { mem: mem, x: x, y: targetY - 80, vy: 0, state: "falling", bounces: 0, t: 0, targetY: targetY };
    /* BINGO 画面正中央（不跟掉落物走） */
    if (bingoEl) {
      bingoEl.style.left = "50%";
      bingoEl.style.top = "50%";
      bingoEl.style.display = "block";
      bingoEl.style.animation = "none";
      void bingoEl.offsetWidth;
      bingoEl.style.animation = "bingoanim 1.5s ease-out forwards";
    }
    /* 小猫说一句引导语（气泡默认锚小猫头顶） */
    var hint = mem.presentation && mem.presentation.hintText ? mem.presentation.hintText : "好像掉了些东西出来，快来看看";
    Bubble.show(hint, null, null, 3200);
    AudioManager.drop();
  }
  function position() { return item ? { x: item.x, y: item.y } : { x: 240, y: 150 }; }
  function update(dt) {
    if (!item) { return; }
    item.t += dt;
    /* 下落物理 */
    if (item.state === "falling") {
      item.vy += 600 * dt;
      item.y += item.vy * dt;
      if (item.y >= item.targetY) {
        item.y = item.targetY;
        item.vy = -item.vy * 0.35;
        item.bounces++;
        if (item.bounces >= 2 || Math.abs(item.vy) < 40) {
          item.state = "settle";
          item.vy = 0;
        }
      }
    }
  }
  function draw(ctx) {
    if (!item) { return; }
    if (!Camera.inView(item.x, item.y, 40)) { return; }
    var c = Camera.toCanvas(item.x, item.y);
    var emoji = "💬";
    var icon = item.mem.presentation.icon;
    if (icon === "diary") { emoji = "📔"; }
    else if (icon === "peach") { emoji = "🍑"; }
    else if (icon === "chat") { emoji = "💬"; }
    else if (icon === "textbook") { emoji = "📖"; }
    /* 更亮的光晕，更清晰明显 */
    var a = 0.6 + 0.3 * Math.sin(item.t * 4);
    ctx.fillStyle = "rgba(255,240,180," + a.toFixed(2) + ")";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
    ctx.fill();
    /* emoji 加阴影，更突出 */
    ctx.font = "28px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

/* ================= SRC: GIFTBOX（礼物盒 + 气球放飞） ================= */
var GiftBox = (function () {
  var item = null; /* { x, y, balloons: [{x,y,collected,vy}] } */

  function spawn(x, y) {
    item = {
      x: x, y: y,
      balloons: [
        { x: x - 20, y: y - 50, color: "#ff6b8a", collected: false, vy: 0 },
        { x: x, y: y - 65, color: "#6bcbff", collected: false, vy: 0 },
        { x: x + 20, y: y - 50, color: "#ffd93d", collected: false, vy: 0 }
      ]
    };
  }
  function reset() { item = null; }
  function isActive() { return !!item; }
  function update(dt) {
    if (!item) { return; }
    item.balloons.forEach(function (b) {
      if (b.collected && b.vy < -200) {
        b.vy -= 100 * dt; /* 往上飞 */
        b.y += b.vy * dt;
      }
    });
  }
  function draw(ctx) {
    if (!item) { return; }
    if (!Camera.inView(item.x, item.y, 100)) { return; }
    /* 画礼物盒 */
    var c = Camera.toCanvas(item.x, item.y);
    var img = Assets.image("gift_box");
    if (img) {
      ctx.drawImage(img, c.x - 30, c.y - 30, 60, 60);
    } else {
      ctx.fillStyle = "#ff6b6b";
      ctx.fillRect(c.x - 20, c.y - 20, 40, 40);
    }
    /* 画气球（像素风 + 高光） */
    item.balloons.forEach(function (b) {
      if (b.collected && b.y < -100) { return; }
      var bc = Camera.toCanvas(b.x, b.y);
      var alpha = b.collected ? Math.max(0, 1 + b.y / 200) : 1;
      ctx.globalAlpha = alpha;
      /* 气球线 */
      ctx.strokeStyle = "#999";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - 20);
      ctx.lineTo(bc.x, bc.y + 12);
      ctx.stroke();
      /* 气球本体（像素风圆） */
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(bc.x, bc.y, 10, 0, Math.PI * 2);
      ctx.fill();
      /* 高光（像素风小白点） */
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.fillRect(bc.x - 4, bc.y - 5, 3, 3);
      /* 底部小结 */
      ctx.fillStyle = b.color;
      ctx.fillRect(bc.x - 2, bc.y + 9, 4, 2);
      ctx.globalAlpha = 1;
    });
  }
  function hitTest(px, py) {
    if (!item) { return false; }
    for (var i = 0; i < item.balloons.length; i++) {
      var b = item.balloons[i];
      if (b.collected) { continue; }
      var dx = px - b.x, dy = py - b.y;
      if (dx * dx + dy * dy < 14 * 14) {
        b.collected = true;
        b.vy = -50; /* 开始往上飞 */
        /* 弹出对应的小纸条图片（memory_gift_balloon_01、02、03） */
        var imgs = ["memory_gift_balloon_01", "memory_gift_balloon_02", "memory_gift_balloon_03"];
        if (imgs[i] && Assets.image(imgs[i])) {
          /* 创建一个临时的 memory 对象，只显示这一张图片 */
          var tempMem = {
            id: "temp_gift_" + i,
            content: {
              title: "小纸条",
              lines: [],
              images: [imgs[i]]
            },
            presentation: {
              template: "pink",
              icon: "note"
            }
          };
          Popup.open(tempMem, function () {
            /* 关掉弹窗后，检查是不是所有气球都点完了 */
            if (GiftBox.allCollected()) {
              GiftBox.reset();
              Triggers.markCollected("memory_gift");
              Collection.mark("memory_gift");
              Album.refresh();
              Dialogue.resume();
              /* 检查是不是所有热区都收集完了，如果是，触发彩蛋视频 */
              if (Hotspots.allCollected()) {
                Bubble.show("你已经找到了所有的回忆", null, null, 3000, "item");
                setTimeout(function() {
                  Ending.show();
                }, 2000);
              }
            }
          });
        }
        return true;
      }
    }
    return false;
  }
  function allCollected() {
    if (!item) { return true; }
    return item.balloons.every(function (b) { return b.collected; });
  }
  function focusPos() {
    /* 返回礼物盒位置（用于方向箭头引导） */
    if (!item) { return null; }
    if (allCollected()) { return null; }
    return { x: item.x, y: item.y };
  }
  return { spawn: spawn, reset: reset, update: update, draw: draw, hitTest: hitTest, allCollected: allCollected, focusPos: focusPos, isActive: isActive };
})();

/* 程序化记忆小图标（相册网格里没有素材图时也用这个兜底） */
function drawMemoryIcon(ctx, mem, cx, cy) {
  var icon = (mem && mem.presentation) ? mem.presentation.icon : mem;
  cx = (typeof cx === "number") ? cx : 32;
  cy = (typeof cy === "number") ? cy : 32;
  ctx.fillStyle = "#171a26"; ctx.fillRect(cx - 32, cy - 32, 64, 64);
  if (icon === "chat") {
    /* 小对话框图标 */
    ctx.fillStyle = "#eef3f7"; ctx.fillRect(cx - 22, cy - 16, 44, 30);
    ctx.fillStyle = "#5c8fb5"; ctx.fillRect(cx - 22, cy - 16, 44, 6);
    ctx.fillStyle = "#9fb9cd"; ctx.fillRect(cx - 16, cy - 6, 32, 2); ctx.fillRect(cx - 16, cy + 2, 24, 2);
    ctx.fillStyle = "#5c8fb5"; ctx.fillRect(cx - 8, cy + 14, 10, 10);
  } else if (icon === "photo") {
    /* 小照片图标 */
    ctx.fillStyle = "#f4c9a0"; ctx.fillRect(cx - 22, cy - 16, 44, 32);
    ctx.fillStyle = "#d98e6a"; ctx.fillRect(cx - 22, cy - 16, 44, 6);
    ctx.fillStyle = "#6b9e4f"; ctx.fillRect(cx - 12, cy - 2, 8, 6); ctx.fillRect(cx + 4, cy - 2, 10, 6);
    ctx.fillStyle = "#8fc8e8"; ctx.fillRect(cx - 10, cy + 10, 10, 6); ctx.fillRect(cx + 4, cy + 8, 12, 8);
  } else {
    /* 桃子 */
    for (var yy = 0; yy < 28; yy++) {
      var t = (yy - 13) / 13;
      var w = Math.round(13 * Math.sqrt(Math.max(0, 1 - t * t)));
      ctx.fillStyle = yy < 6 ? "#ffd9a0" : (yy < 20 ? "#f7b267" : "#e8934a");
      ctx.fillRect(cx - w, cy - 14 + yy, w * 2, 1);
    }
    ctx.fillStyle = "#d98e4a"; ctx.fillRect(cx - 1, cy - 12, 2, 24);
    ctx.fillStyle = "#7a4a21"; ctx.fillRect(cx - 1, cy - 20, 4, 6);
    ctx.fillStyle = "#6b9e4f"; ctx.fillRect(cx - 8, cy - 22, 12, 4);
    ctx.fillStyle = "#4a7a36"; ctx.fillRect(cx - 8, cy - 21, 2, 4);
  }
}

/* ================= SRC: POPUP（弹窗控制器 + 模板注册表：内容与长相分离，模板可扩展） ================= */
var Popup = (function () {
  var root, onCloseCb = null;
  var templates = {};

  function init() {
    root = document.getElementById("popup");
    document.getElementById("pclose").addEventListener("click", close);
  }

  /* 模板注册表：表现层可扩展。以后加"卡片""多图翻页""动画+文字"等，
     只需 Popup.registerTemplate("gallery", renderer)，开合/回调/触发逻辑零改动。 */
  function registerTemplate(name, renderer) { templates[name] = renderer; }

  function open(memory, onClose) {
    var tpl = templates[memory.presentation.template] || templates["default"];
    tpl(root, memory);
    onCloseCb = onClose || null;
    root.classList.remove("hidden");
    AudioManager.popupOpen();
  }
  function close() {
    if (!root.classList.contains("hidden")) {
      root.classList.add("hidden");
      AudioManager.popupClose();
      /* 停掉弹窗里所有的视频和音频 */
      var videos = root.querySelectorAll("video");
      videos.forEach(function(v) { v.pause(); v.currentTime = 0; });
      var audios = root.querySelectorAll("audio");
      audios.forEach(function(a) { a.pause(); a.currentTime = 0; });
      var cb = onCloseCb; onCloseCb = null;
      if (cb) { cb(); }
    }
  }
  function isOpen() { return root && !root.classList.contains("hidden"); }
  function reset() { if (root) { root.classList.add("hidden"); } onCloseCb = null; }
  return { init: init, registerTemplate: registerTemplate, open: open, close: close, isOpen: isOpen, reset: reset };
})();

/* ================= SRC: BUBBLE（小猫的气泡提示：镜头坐标定位） ================= */
var Bubble = (function () {
  var el, hideAt = 0, tx = null, ty = null;
  function init() { el = document.getElementById("catbubble"); }
  function show(text, x, y, ms, type) {
    if (!el) { return; }
    el.textContent = text;
    el.classList.add("show");
    /* 区分类型：cat（小猫说的，浅蓝色）/ item（物品说的，浅米色） */
    if (type === "item") { el.classList.add("bubble-item"); } else { el.classList.remove("bubble-item"); }
    if (typeof x === "number" && typeof y === "number") { tx = x; ty = y; } else { tx = null; ty = null; }
    hideAt = performance.now() + (ms || 3000);
    AudioManager.bubble();
  }
  function tick() {
    if (!el || !el.classList.contains("show")) { return; }
    var wx, wy;
    if (tx !== null && ty !== null) {
      /* 指定了世界坐标（如掉落提示）：锚定该点 */
      wx = tx; wy = ty;
    } else {
      /* 默认：跟着小猫头顶移动 */
      var p = Player.state();
      wx = p.x; wy = p.y - 18;
    }
    var sp = Camera.toScreen(wx, wy);
    el.style.left = Math.max(10, Math.min(90, sp.x * 100)) + "%";
    el.style.top = Math.max(8, Math.min(82, sp.y * 100)) + "%";
    if (performance.now() > hideAt) { el.classList.remove("show"); }
  }
  function hide() { if (el) { el.classList.remove("show"); } }
  return { init: init, show: show, tick: tick, hide: hide };
})();

      var playerPos = Player.state();
      var hcx = hs.x + hs.w / 2, hcy = hs.y + hs.h / 2;

      if (isRequired && Dialogue.currentWaiting() !== hs.id) { return; } /* 必选项，台词还没到，不画闪光点 */
      if (!isRequired && dist > NEAR_RADIUS && !isFocus) { return; } /* 可选项，小猫没靠近，且不是 focus 模式，不画闪光点 */

      if (dropActive && !isFocus) {
        if (dist < DROP_RADIUS + Math.max(hs.w, hs.h) / 2) { return; } /* 重叠则不画闪光点 */
      }

      var hcx = hs.x + hs.w / 2, hcy = hs.y + hs.h / 2;
      if (!Camera.inView(hcx, hcy, hs.w)) { return; }   /* 不在镜头内不画 */
      var speed = isFocus ? 0.9 : 1.6;

    for (var i = 0; i < list().length; i++) {

      if (focus && hs.id !== focus) { continue; }
      if (hs.memory) { continue; } /* 跳过有 memory 的热区，再测纯对白 */
      if (x >= hs.x - PAD && x <= hs.x + hs.w + PAD && y >= hs.y - PAD && y <= hs.y + hs.h + PAD) { return hs; }

  }

    var ps = Player.state();

/* ================= SRC: FULL LETTER（完整的一封信，随时可读） ================= */

/* ================= SRC: ENDING（信读完的结尾） ================= */
var Ending = (function () {
  var root;
  function init() {
    root = document.getElementById("ending");

      root.classList.add("hidden");
      FullLetter.show();
    });
    document.getElementById("eAgain").addEventListener("click", restart);
  }

    root.classList.remove("hidden");

  function isOpen() { return root && !root.classList.contains("hidden"); }

    root.classList.add("hidden");
    Triggers.reset();
    Hotspots.reset();
    MemoryDrop.reset();
    Popup.reset();
    Bubble.hide();
    SceneHint.hide();

    Dialogue.start();
  }

/* ================= SRC: STATION（站标：场景 asset → 第N站） ================= */

  var root;

    root = document.getElementById("album");

    });

      stat.className = "astat";

  Assets.register({ id: "memory_gift_balloon_02", kind: "image", src: "assets/memory-content/memory_gift_balloon_02.png" });

  Assets.register({ id: "memory_sunset_02_01", kind: "image", src: "assets/memory-content/memory_sunset_02_01.jpg" });
  /* 背景图注册 */
  Assets.register({ id: "map_rice", kind: "image", src: "assets/maps/map_rice.webp" });
  Assets.register({ id: "map_final", kind: "image", src: "assets/maps/map_final.webp" });
  /* 预留素材槽（接口示例，后续需要时接入渲染即可，不改逻辑）：
     effect_rain → assets/effects/effect_rain.gif（或 sprite / sequence / video / procedural）
     ui_dialogue → assets/ui/ui_dialogue.png
     ui_popup    → assets/ui/ui_popup.png
     bgm_scene   → assets/audio/bgm_scene.mp3（经 AudioManager.setMusic 接入） */
  /* 资源预加载改为"视频开始播放后才触发"（视频优先下载，播放期间后台加载图片等资源） */
  window.__lazyPreload = function () {
    ["map_classroom", "map_classroom_dusk", "map_rice", "map_final", "player_cat", "memory_peach", "memory_textbook", "memory_content_peach_01", "memory_chat_01", "memory_diary_01", "player_voice_01", "memory_textbook_01", "gift_box", "memory_baoji_station", "photo_panda", "photo_group", "memory_sunset_01", "memory_sunset_02", "memory_signature_01", "memory_signature_02", "memory_train_junior", "memory_train_senior", "memory_sakura_girl_01", "memory_sakura_bag_01", "memory_rain_umbrella", "memory_rain_letter", "memory_gift_balloon_01", "memory_gift_balloon_02", "memory_gift_balloon_03", "memory_sakura_tree_01", "memory_sakura_tree_02", "memory_sakura_ground_01", "memory_sakura_building", "memory_rice_note", "memory_bar_note", "memory_bar_phone"].forEach(function (id) {
      Assets.load(id);
    });
  };

  /* 点击换算：DOM 事件 → 画布逻辑坐标 → 世界坐标（镜头裁剪后两者不再一致） */
  function toInternal(e) {
    var r = canvas.getBoundingClientRect();
    var cx = (e.clientX - r.left) / r.width * canvas.width;
    var cy = (e.clientY - r.top) / r.height * canvas.height;
    var w = Camera.toWorld(cx, cy);
    return { x: w.x, y: w.y };
  }
  function overlayBusy() {
    return Popup.isOpen() || FullLetter.isOpen() || Ending.isOpen() || Album.isOpen();
  }

  var KEYMAP = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };
  document.addEventListener("keydown", function (e) {
    AudioManager.init();
    if (KEYMAP[e.key]) { Player.setKey(KEYMAP[e.key], true); e.preventDefault(); return; }
    /* 回退上一句（纠错） */
    if (e.key === "PageUp" || e.key === "[") {
      e.preventDefault();
      if (overlayBusy()) { return; }
      Dialogue.back();
      return;
    }
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (Popup.isOpen()) { Popup.close(); return; }
      if (FullLetter.isOpen()) { FullLetter.close(); return; }
      if (Ending.isOpen()) { return; }
      if (Album.isOpen()) { return; }
      Dialogue.advance();
      layout();
    }
    if (e.key === "Escape") {
      if (Popup.isOpen()) { Popup.close(); }
      if (FullLetter.isOpen()) { FullLetter.close(); }
      if (Album.isOpen()) { Album.close(); }
    }
  });
  document.addEventListener("keyup", function (e) {
    if (KEYMAP[e.key]) { Player.setKey(KEYMAP[e.key], false); }
  });

  canvas.addEventListener("click", function (e) {
    AudioManager.init();
    var p = toInternal(e);
    /* 优先级：掉落物（必点剧情）> 礼物盒 > 必选项热区（required）> 可选项热区 > 纯对白 */
    if (MemoryDrop.hitTest(p.x, p.y)) { MemoryDrop.collect(); return; }
    if (GiftBox.hitTest(p.x, p.y)) {
      /* 点击气球已经在 hitTest() 里处理了（弹出图片 + 检查是否全部点完） */
      return;
    }
    /* 先测必选项热区（required: true） */
    var hs = Hotspots.hitTestRequired(p.x, p.y);
    if (hs) { Hotspots.onClick(p.x, p.y); return; }
    /* 再测其他热区 */
    if (Hotspots.onClick(p.x, p.y)) { return; }
  });

  document.getElementById("dialogue").addEventListener("click", function () {
    AudioManager.init();
    if (overlayBusy()) { return; }
    Dialogue.advance();
    layout();
  });
  document.getElementById("dprev").addEventListener("click", function (e) {
    e.stopPropagation();
    AudioManager.init();
    if (overlayBusy()) { return; }
    Dialogue.back();
    layout();
  });

  var btnMute = document.getElementById("btnMute");
  var icoOn = document.getElementById("icoOn"), icoOff = document.getElementById("icoOff");
  var volumePanel = document.getElementById("volumePanel");
  var sfxVolumeSlider = document.getElementById("sfxVolume");
  var musicVolumeSlider = document.getElementById("musicVolume");
  btnMute.addEventListener("click", function () {
    AudioManager.init();
    /* 弹出/隐藏音量控制面板 */
    if (volumePanel.style.display === "none" || !volumePanel.style.display) {
      volumePanel.style.display = "block";
      /* 初始化滑块的值 */
      sfxVolumeSlider.value = AudioManager.getSfxVolume() * 100;
      musicVolumeSlider.value = AudioManager.getMusicVolume() * 100;
    } else {
      volumePanel.style.display = "none";
    }
  });
  /* 音效滑块 */
  sfxVolumeSlider.addEventListener("input", function () {
    var v = parseInt(this.value) / 100;
    AudioManager.setSfxVolume(v);
  });
  /* 音乐滑块 */
  musicVolumeSlider.addEventListener("input", function () {
    var v = parseInt(this.value) / 100;
    AudioManager.setMusicVolume(v);
  });
  var btnAlbum = document.getElementById("btnAlbum");
  var _clickCount = 0, _clickTimer = null;
  btnAlbum.addEventListener("click", function () {
    AudioManager.init();
    /* 双击相册：弹出段落快速跳转输入框（测试用） */
    _clickCount++;
    if (_clickCount === 2) {
      clearTimeout(_clickTimer);
      _clickCount = 0;
      var list = CONTENT.letter.segments.map(function (s, i) {
        return i + ". " + s.id;
      }).join("  ");
      var sel = prompt("快速跳转到第几段？（0-" + (CONTENT.letter.segments.length - 1) + "）\n\n" + list);
      if (sel !== null) {
        var n = parseInt(sel);
        if (!isNaN(n) && n >= 0 && n < CONTENT.letter.segments.length) {
          window.location.hash = "#seg=" + n;
          window.location.reload();
        }
      }
      return;
    }
    _clickTimer = setTimeout(function () {
      _clickCount = 0;
      Album.open();
    }, 250);
  });

  /* 浮球移动键（半透明小球，按住向任意方向拖，出现半透明圆环指示） */
  var pad = document.getElementById("pad");
  var padBall = document.getElementById("padball");
  var padRing = document.getElementById("padring");
  var padActive = false, padKeys = {};
  var PAD_TH = 22; /* 拖动多少像素触发移动 */
  function padSet(k, on) { Player.setKey(k, on); padKeys[k] = on; }
  pad.addEventListener("pointerdown", function (e) {
    e.preventDefault(); AudioManager.init();
    padActive = true; padRing.classList.add("on");
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
  });
  pad.addEventListener("pointermove", function (e) {
    if (!padActive) return;
    var r = pad.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    padBall.style.transform = "translate(" + dx + "px," + dy + "px)";
    var keys = { up: false, down: false, left: false, right: false };
    if (Math.abs(dx) >= PAD_TH) keys[dx < 0 ? "left" : "right"] = true;
    if (Math.abs(dy) >= PAD_TH) keys[dy < 0 ? "up" : "down"] = true;
    Object.keys(keys).forEach(function (k) { if (keys[k] !== padKeys[k]) padSet(k, keys[k]); });
  });
  function padRelease() {
    if (!padActive) return;
    padActive = false;
    padBall.style.transform = "translate(0,0)";
    padRing.classList.remove("on");
    Object.keys(padKeys).forEach(function (k) { if (padKeys[k]) padSet(k, false); });
  }
  pad.addEventListener("pointerup", padRelease);
  pad.addEventListener("pointercancel", padRelease);
  pad.addEventListener("pointerleave", padRelease);

  var _inPad = false; /* 自动触发防抖：只有"走进"热区的那一刻才弹，关掉后站在原地不重开 */
  var _startTime = Date.now(); /* 开场时间戳，1 秒内不自动触发 */
  function loop(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;
    Player.update(dt);
    /* 猫走进光点热区的那一刻自动触发对白（开场 1 秒内不检测，避免出生即触发） */
    if (!Hotspots.isOpen() && (Date.now() - _startTime > 1000)) {
      var ps = Player.state();
      var hs = Hotspots.hitTest(ps.x, ps.y);
      var inside = !!hs;
      if (inside && !_inPad && hs && !Hotspots.isCollected(hs.id)) { Hotspots.onClick(ps.x, ps.y); }
      _inPad = inside;
    } else { _inPad = true; }
    /* 场景触发记忆：玩家走进发光触发区 → 弹记忆弹窗（收集后提示条自动收起） */
    var sc = Triggers.activeScene();
    if (sc && !overlayBusy() && !Hotspots.isOpen()) {
      var sm = MEMORIES[sc];
      if (sm) {
        var zr = SceneCore.zoneRect(sm.trigger.zone);
        var pss = Player.state();
        if (zr && pss.x >= zr.x && pss.x <= zr.x + zr.w && pss.y >= zr.y && pss.y <= zr.y + zr.h) {
          Triggers.clearScene();
          Popup.open(sm, function () {
            Triggers.markCollected(sm.id);
            Collection.mark(sm.id);
            SceneHint.hide();
            Album.refresh();
          });
        }
      }
    }
    MemoryDrop.update(dt);
    GiftBox.update(dt);
    Bubble.tick();
    Hotspots.tick();
    CatDialog.update(); /* 黑猫对白系统：按场景随机弹，克制不打扰 */
    ctx.fillStyle = "#171a26";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    MapRenderer.draw(ctx, ts / 1000, Triggers.activeScene());
    Hotspots.draw(ctx, ts / 1000);
    MemoryDrop.draw(ctx);
    GiftBox.draw(ctx);
    CharacterRenderer.draw(ctx, Player.state(), ts / 1000);

    /* 方向箭头：focus 等待时，从小猫指向目标，小猫走近后自动隐藏 */
    var arrow = document.getElementById("wayarrow");
    var fp = Hotspots.focusPos() || GiftBox.focusPos();
    if (fp) {
      var ps = Player.state();
      var dx = fp.x - ps.x, dy = fp.y - ps.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 24) {
        /* 箭头放在小猫和目标之间 60% 的位置（靠近目标一点） */
        var ax = ps.x + dx * 0.6;
        var ay = ps.y + dy * 0.6;
        var asp = Camera.toScreen(ax, ay);
        var angle = Math.atan2(dy, dx) * 180 / Math.PI;
        arrow.style.display = "block";
        arrow.style.left = Math.max(6, Math.min(94, asp.x * 100)) + "%";
        arrow.style.top = Math.max(6, Math.min(80, asp.y * 100)) + "%";
        arrow.style.transform = "translate(-50%,-50%) rotate(" + angle + "deg)";
      } else {
        arrow.style.display = "none";
      }
    } else {
      arrow.style.display = "none";
    }

    requestAnimationFrame(loop);
  }

  AudioManager.init();
  layout();
  Popup.init(); MemoryDrop.init(); Bubble.init(); Dialogue.init(); FullLetter.init(); Ending.init(); SceneHint.init(); Hotspots.init(); Station.applyScene("map_classroom", "5/3"); Album.init();
  Player.spawn(SceneCore.spawn().x, SceneCore.spawn().y);
  /* 开场遮罩：点击后才开始 */
  var ov = document.getElementById("startoverlay");
  ov.addEventListener("click", function () {
    AudioManager.init();
    ov.style.display = "none";
    _startTime = Date.now(); /* 重置开场计时器，1 秒内不自动触发 */
    Dialogue.start();
  }, { once: true });
  requestAnimationFrame(function (ts) { last = ts; requestAnimationFrame(loop); });
})();

/* ===== 开屏片头控制 ===== */
(function () {
  var v = document.getElementById("splash_video");
  var splash = document.getElementById("splash");
  var skip = document.getElementById("splash_skip");
  var snd = document.getElementById("splash_sound");
  var prog = document.getElementById("splash_progress");
  var fill = document.getElementById("sp_fill");
  var text = document.getElementById("sp_text");
  var vload = document.getElementById("splash_vload");
  var svFill = document.getElementById("sv_fill");
  var svText = document.getElementById("sv_text");
  var ids = ["map_classroom","map_classroom_dusk","map_rice","map_final","player_cat","memory_peach","memory_textbook","memory_content_peach_01","memory_chat_01","memory_diary_01","player_voice_01","memory_textbook_01","gift_box","memory_baoji_station","photo_panda","photo_group","memory_sunset_01","memory_sunset_02","memory_signature_01","memory_signature_02","memory_train_junior","memory_train_senior","memory_sakura_girl_01","memory_sakura_bag_01","memory_rain_umbrella","memory_rain_letter","memory_gift_balloon_01","memory_gift_balloon_02","memory_gift_balloon_03","memory_sakura_tree_01","memory_sakura_tree_02","memory_sakura_ground_01","memory_sakura_building","memory_rice_note","memory_bar_note","memory_bar_phone"];
  var registered = ids.filter(function (id) { return Assets.has(id); });
  var waiting = false, entered = false;
  function readyCount() { return registered.filter(function (id) { return Assets.isLoaded(id); }).length; }
  function allReady() { return registered.length > 0 && readyCount() >= registered.length; }
  function enter() {
    if (entered) return; entered = true;
    splash.classList.add("hidden");
  }
  var ctrl = document.getElementById("splash_ctrl");
  var pauseBtn = document.getElementById("splash_pause");
  var playbar = document.getElementById("splash_playbar");
  var progbar = document.getElementById("splash_prog");
  function updProg() {
    if (v.duration && isFinite(v.duration)) {
      progbar.style.width = (v.currentTime / v.duration * 100) + "%";
    }
    pauseBtn.textContent = v.paused ? "▶" : "⏸";
  }
  pauseBtn.addEventListener("click", function () {
    if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    else { v.pause(); }
  });
  v.addEventListener("timeupdate", updProg);
  v.addEventListener("play", updProg);
  v.addEventListener("pause", updProg);
  playbar.addEventListener("click", function (e) {
    var r = playbar.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    if (v.duration && isFinite(v.duration)) { v.currentTime = ratio * v.duration; }
  });
  /* 视频加载条：视频加载期间显示居中的加载进度，视频能播后自动消失 */
  function updVLoad() {
    var b = v.buffered, dur = v.duration;
    var p = 0;
    if (dur && isFinite(dur) && b && b.length) { p = Math.min(100, Math.round(b.end(b.length - 1) / dur * 100)); }
    svFill.style.width = p + "%";
    svText.textContent = "正在加载视频 " + p + "%";
  }
  function hideVLoad() { if (vload) vload.classList.add("hidden"); }
  v.addEventListener("progress", updVLoad);
  v.addEventListener("canplay", hideVLoad);
  v.addEventListener("playing", hideVLoad);
  if (v.readyState >= 3) hideVLoad();  // 视频已可播则立即隐藏加载条
  setInterval(function () {
    var tot = registered.length, rc = readyCount();
    var pct = tot ? Math.round(rc / tot * 100) : 100;
    fill.style.width = pct + "%";
    text.textContent = "加载中 " + pct + "%";
    if (waiting && allReady()) enter();
  }, 200);
  v.addEventListener("ended", function () {
    if (allReady()) enter();
    else { ctrl.classList.add("hidden"); waiting = true; prog.classList.remove("hidden"); }
  });
  skip.addEventListener("click", function () {
    if (allReady()) { enter(); }
    else {
      try { v.currentTime = 0; v.pause(); } catch (e) {}
      ctrl.classList.add("hidden");
      waiting = true;
      prog.classList.remove("hidden");
    }
  });
  snd.addEventListener("click", function () {
    v.muted = false; v.volume = 0.8;
    snd.style.display = "none";
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  });
  /* 视频一开始播放，就立刻在后台开始加载其他资源（视频播放期间预加载） */
  var __preStarted = false;
  v.addEventListener("playing", function () {
    if (!__preStarted && window.__lazyPreload) { __preStarted = true; window.__lazyPreload(); }
  });
  var p0 = v.play();
  if (p0 && p0.catch) p0.catch(function () {});
})();
