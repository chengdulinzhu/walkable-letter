<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23171a26'/%3E%3Crect x='4' y='1' width='8' height='6' fill='%23e8934a'/%3E%3Crect x='5' y='3' width='2' height='2' fill='%231e1e2f'/%3E%3Crect x='9' y='3' width='2' height='2' fill='%231e1e2f'/%3E%3Crect x='4' y='7' width='8' height='6' fill='%23f6efe0'/%3E%3Crect x='12' y='5' width='3' height='6' fill='%23e8934a'/%3E%3C/svg%3E">
<style>
/* ============================================================
   表现层样式（当前为临时占位视觉，之后可整体替换皮肤）
   换视觉 ≠ 改逻辑：逻辑层只认 Assets 语义 ID，不认这里的具体样式。
   ============================================================ */
:root{
  --bg:#0b0d13;
  --panel:#171a26;
  --panel2:#232741;
  --line:#3a4058;
  --ink:#f2e8cf;
  --dim:#8f88ab;
  --gold:#ffd166;
  --accent:#e8934a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;touch-action:manipulation}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"ZCOOL QingKe HuangYou","Courier New","NSimSun","SimSun",monospace;
  min-height:100vh;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
#screen{
  width:100%;
  background:transparent;
  border:0;
  box-shadow:none;
  padding:0;
}
#canvaswrap{position:relative;width:100%;aspect-ratio:480/288;background:#171a26;border-bottom:3px solid #000;overflow:hidden}
#scene{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);opacity:.6}
#caption{position:absolute;top:8px;left:10px;font-size:12px;letter-spacing:3px;color:var(--dim);text-shadow:1px 1px 0 #000;z-index:3;white-space:nowrap;max-width:calc(100% - 84px);overflow:hidden;text-overflow:ellipsis}
#corner{position:absolute;top:6px;right:8px;display:flex;gap:6px;z-index:3}
.pxbtn{
  font-family:inherit;font-size:12px;color:var(--ink);
  background:var(--panel2);border:2px solid #000;
  box-shadow:inset 2px 2px 0 #3a4058,inset -2px -2px 0 #0d0f18;
  padding:2px 9px;cursor:pointer;line-height:1.4;
}
.pxbtn:hover{background:#2b3150}
.pxbtn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.pxbtn:active{transform:translate(1px,1px);box-shadow:inset 2px 2px 0 #0d0f18}
.pxbtn svg{display:block;width:13px;height:13px}

#dialogue{
  position:relative;background:#faf3e3;border-top:3px solid #8b6f4e;
  padding:14px 18px 12px;cursor:pointer;user-select:none;
  box-shadow:inset 0 3px 0 #f0e2c8, inset 0 -3px 0 #e8d9b8;
}
/* 顶部像素虚线装饰 */
#dialogue::before{
  content:"";position:absolute;top:5px;left:18px;right:18px;height:2px;
  background-image:linear-gradient(90deg,#c9a876 50%,transparent 50%);
  background-size:8px 2px;background-repeat:repeat-x;opacity:.6;
}
/* 左上角小像素爱心 */
#dialogue::after{
  content:"❤";position:absolute;top:3px;left:14px;font-size:10px;color:#d48a9a;
  font-family:monospace;
}
.dinner{width:100%;margin:0 auto;position:relative;max-width:720px;padding-top:6px}
#dtext{font-size:16px;line-height:1.9;letter-spacing:.5px;color:#4a3828;min-height:58px}
#dbar{margin-top:8px;height:5px;background:#e8d9b8;border:1px solid #8b6f4e;position:relative}
#dbarfill{height:100%;width:0;background:#b8864f}
#dnext{position:absolute;right:8px;bottom:10px;color:#b8864f;font-size:20px;animation:blink 1s steps(2) infinite;font-weight:bold}
#controls{font-size:10px;color:#b09a7e;margin-top:8px;letter-spacing:2px;padding-right:26px;font-family:monospace}
#controls::before{content:"✉ ";color:#c9a876}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

#catbubble{
  position:absolute;z-index:4;display:none;transform:translate(-50%,-100%);
  background:#fffdf4;color:#33291a;border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.45);
  padding:3px 9px;font-size:12px;white-space:nowrap;
}
#catbubble.show{display:block}
#bingo{
  position:absolute;z-index:4;display:none;transform:translate(-50%,-50%);
  font-size:36px;font-weight:bold;color:var(--gold);letter-spacing:3px;
  font-family:"Press Start 2P","Courier New",monospace;
  text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;
}
@keyframes bingoanim{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}

#scenehint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;
  background:rgba(20,24,36,.92);border:2px solid #000;box-shadow:0 0 0 2px #2c3247;
  color:var(--gold);font-size:12px;padding:5px 14px;letter-spacing:1px;
  white-space:nowrap;max-width:92%;text-align:center;overflow:hidden;text-overflow:ellipsis;
}
#dpad{position:absolute;left:10px;bottom:10px;width:96px;height:96px;z-index:4;display:none}
.dbtn{
  position:absolute;width:44px;height:44px;padding:0;cursor:pointer;
  background:rgba(35,39,65,.82);border:2px solid #000;
  box-shadow:inset 2px 2px 0 #3a4058,inset -2px -2px 0 #0d0f18;
  color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.dbtn.active{background:#2b3150}
.dbtn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.dbtn svg{display:block;width:16px;height:16px}
#dp-up{top:0;left:26px}
#dp-left{top:26px;left:0}
#dp-right{top:26px;left:52px}
#dp-down{top:52px;left:26px}
@media (pointer:coarse){#dpad{display:block}}

.overlay{position:absolute;inset:0;z-index:6;background:rgba(7,8,13,.62);display:flex;align-items:center;justify-content:center}
.hidden{display:none!important}
.pwin{
  width:min(340px,88%);background:var(--panel);border:3px solid #000;
  box-shadow:inset 3px 3px 0 #0d0f18,inset -3px -3px 0 #2c3247,0 0 0 3px #3a4058,8px 8px 0 rgba(0,0,0,.45);
  padding:0 0 12px;
}
.ptitle{background:#2b3150;color:var(--gold);padding:7px 12px;font-size:13px;letter-spacing:3px;border-bottom:2px solid #000}
#ptpl{display:flex;flex-direction:column;padding:12px 12px 4px}
.pimg{width:100%;height:130px;border:2px dashed #4a5170;background:#10131c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:12px;letter-spacing:1px}
.picon{width:56px;height:56px;image-rendering:pixelated;border:2px solid #000;background:#171a26}
.pimg-real{max-width:100%;max-height:130px;object-fit:contain}
.pimgnote{margin:8px 0 0;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
.plines{font-size:13px;line-height:1.9;color:var(--ink);margin-top:10px}
#pclose{cursor:pointer}
.fwin{width:min(560px,92%);background:var(--panel);border:3px solid #000;box-shadow:inset 3px 3px 0 #0d0f18,inset -3px -3px 0 #2c3247,0 0 0 3px #3a4058,8px 8px 0 rgba(0,0,0,.45);max-height:86%;display:flex;flex-direction:column}
#ftext{flex:1;overflow:auto;padding:14px 16px;font-size:13px;line-height:2;white-space:pre-wrap;color:var(--ink)}
#fclose{margin:10px auto 14px;display:block}
.ewin{width:min(420px,88%);background:var(--panel);border:3px solid #000;box-shadow:inset 3px 3px 0 #0d0f18,inset -3px -3px 0 #2c3247,0 0 0 3px #3a4058,8px 8px 0 rgba(0,0,0,.45);padding:18px;text-align:center}
.ewin p{font-size:14px;line-height:2;color:var(--dim);margin:8px 0 18px}
.ebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (max-width:560px){
  #dtext{font-size:14px;min-height:auto;}
  #caption{display:none}

  #screen{display:flex;flex-direction:column;height:100vh;background:#faf3e3;}
  #canvaswrap{flex:0 0 auto;width:100%;aspect-ratio:4/5;background:#faf3e3;border-bottom:3px solid #8b6f4e;padding:0;}
  #scene{width:100%;height:100%;object-fit:cover;object-position:center center;}
  #dialogue{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 16px;border-top:none;}
  #dialogue::before{top:5px;left:16px;right:16px;}
  .dinner{padding-top:6px;}
  #dbar{margin-top:6px;}
  #controls{margin-top:5px;font-size:9px;}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>

<script>
/* ============================================================
   一封可以走进去的信 · 架构重构 v2
   规则：表现层（视觉素材）与逻辑层（交互）彻底解耦。
   - 逻辑只通过 Assets 语义 ID 取素材，绝不写死文件名 / 图案。
   - 无素材时自动回退到程序化占位，保证永远能跑。
   - 内容（信 / 记忆 / 地图数据）独立成段，改内容不动逻辑。
   素材目录（替换素材 = 放文件 + 改 Assets 里一条规格，不动逻辑）：
   assets/
     maps/            map_classroom.png（完整地图整图）
     characters/      player_cat.png（Sprite Sheet 或单图）
     ui/              ui_dialogue.png / ui_popup.png / ui_button_*.png
     memory-objects/  memory_peach.png / memory_textbook.png
     memory-content/  记忆里的真实照片（jpg/png）
     effects/         effect_rain.gif / .webm / 多帧 / sprite
     audio/           bgm_*.mp3 / sfx_*.wav
   ============================================================ */

/* ================= CONTENT: LETTER（信的原文，唯一叙事 Source of Truth） ================= */
var LETTER = {
  title: "一封可以走进去的信",
  to: "To 杨女士",
  /* 完整原文（不改一字，最终可完整阅读） */
  fullText: `亲爱的朋友，也许长大后生日变得不再那样值得期待，但我想那也许意味着每一天都值得期待。

我们不再需要一个特殊的日子才能庆祝。所以准备好了吗？我来带你看看我们还记得些什么。

那天我问你，我们第一次见面说的话是什么，你还记得吗？

其实我也不记得了。

但我记得你第一次，是在初一的语文课上。那个时候你刚转学来，印象中穿着蓝色的牛仔裙衫，下面是条红棕色的铅笔裤吗？

还是说我留了那张照片，所以对你的回忆停在了那个地方。

那天，课文朗诵朗读的环节，你的角色是羚羊木雕里万芳的妈妈，我是万方。小时候心里别别扭扭的，隔了很久也记得这种感觉。

后来我们坐对桌，吵吵闹闹，总因为小事偷偷别扭。嗯...小时候还在交换日记里偷偷骂你【大小姐脾气】，但其实很欣赏你敢怒敢言的勇气吧，毕竟自己那时候是个软蛋。

再后来我们同桌，你说：因为一句话我们冷战了很久很久。我一丁点儿印象也没有，但还好，到底是天天见的，最终还是和好了。

后来我们到了新的学校，并没有在一个班。我想幸好没有在一个班，不然以当时的脾气，闹起别扭来怕是要冷战一辈子。

也许是恰到好处的距离，我们反而变得亲近。

但什么时候真正意识到，原来我们是那样好的朋友呢？

我想大概是某天回家，另一个朋友S跟我说，因为你给我塞了个桃子，你很开心的去和她炫耀。

我想或许你早已忘记，但我记得。那个时候我拥有的空间不大，但哪里都能找到你零碎的影子：糖果、卡片、小纸条、贴纸、水果，乱七八糟的。那个时候我想，如果“爱”人是一种天分，那你一定是个天才。到处都是你的影子。

后面呢，我们总是在午休后一起去教室。我们在顶楼，你在二楼的里侧，我总是会早到些。于是每天看到你蹦蹦跳跳地跑来，拿起一些小玩意儿塞给我。后来你说“以后不会让你等我太久”，我还是会吐槽【磨叽！】，但那样的日子竟然也觉得是让人怀念的。

再后来呢，我还记得有天下雨，忘记带伞，和你一同撑伞回去。第二天你说 下雨天幸好我带了伞，让你没有被淋湿，这是你觉得很幸福的这件事情。那张小卡在很久的时间里也同样让我觉得幸福的。

我想：我同样因为你明白了：人并非不能爱人，人们只是太期待得到爱，从而在爱与被爱里进退两难。

但你向来大胆，对你喜欢的从来都是尽全力争取，也从不担心落空。正大光明的给世界你的爱，也正大光明的受伤，然后站起来继续往前走。

哪怕至今我也不懂这个字意味着什么，但我想我从你身上得到的爱，让我对世界变得挑剔，却也忘记了。你总是勇敢的决定让任何人该出现在你生命的哪个位置，然后像苏格拉底的稻穗一样，闭上眼睛穿过整个稻田。

我想我总有一种幻觉：逃离熟悉的一切，从头开始，这像对另一种安全的渴望，像是更强大、更自洽、更游刃有余、更平和，然后才能建立起良好的关系。

在一个全新的副本里，没有人认识曾经的我。那个我有什么好的呢？她有那么多缺点，她什么都不会，她根本没有成长起来。

可是好像成为你的朋友的时候，我就是不够好的。

所以人不是因为完美才被爱的。我们接纳的或许就是那个不够好的，有很多缺点，但依然值得被好好对待的彼此吧。

/* ================= SRC: TRIGGERS（触发状态：哪个场景物件激活、哪些记忆已收集） ================= */
var Triggers = (function () {
  var activeSceneId = null, collected = {};
  function activateScene(id) { activeSceneId = id; }
  function clearScene() { activeSceneId = null; }
  function isSceneActive(id) { return activeSceneId === id; }
  function activeScene() { return activeSceneId; }
  function isCollected(id) { return !!collected[id]; }
  function markCollected(id) { collected[id] = true; if (activeSceneId === id) { activeSceneId = null; } }
  function reset() { collected = {}; activeSceneId = null; }
  return { activateScene: activateScene, clearScene: clearScene, isSceneActive: isSceneActive, activeScene: activeScene, isCollected: isCollected, markCollected: markCollected, reset: reset };
})();

/* ================= SRC: PLAYER（控制器：移动 + 碰撞 + 开场跳入，纯逻辑不碰视觉） ================= */
var Player = (function () {
  var x = 0, y = 0, dir = 0, moving = false, wasMoving = false;
  var SPEED = 64, keys = { up: false, down: false, left: false, right: false };
  var MEOWS = ["喵~", "跟我来", "这边走", "嗯？"];
  /* 开场跳入动画：猫从对话框下方跳进画面右下角 */
  var intro = { active: false, t: 0, dur: 0.9, fx: 0, fy: 0, tx: 0, ty: 0 };
  function spawn(tx, ty) {
    x = tx * SceneCore.TILE + 8; y = ty * SceneCore.TILE + 8;
    /* 从画布外下方跳入到这个点 */
    intro.active = true; intro.t = 0;
    intro.fx = x; intro.fy = SceneCore.H * SceneCore.TILE + 60;  // 从黑色底框下方跳进
    intro.tx = x; intro.ty = y;
    dir = 2; // 朝右走帧
  }
  function setKey(k, v) { keys[k] = v; }
  function update(dt) {
      if (intro.active) {
      intro.t += dt;
      var p = Math.min(1, intro.t / intro.dur);
      /* 抛物线：x 线性，y 先升后降 */
      x = intro.fx + (intro.tx - intro.fx) * p;
      var arc = Math.sin(p * Math.PI) * 40;  // 跳跃弧度
      y = intro.fy + (intro.ty - intro.fy) * p - arc;
      moving = true; dir = 2;
      if (p >= 1) { intro.active = false; moving = false; y = intro.ty; dir = 0; }
      return;
    }
    var vx = 0, vy = 0;
    if (keys.up) { vy -= 1; } if (keys.down) { vy += 1; }
    if (keys.left) { vx -= 1; } if (keys.right) { vx += 1; }
    moving = (vx !== 0 || vy !== 0);
    if (moving) {
      if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
      if (vx > 0) { dir = 2; }            // 右走 → 右侧面
      else if (vx < 0) { dir = 3; }       // 左走 → 左侧面
      else { dir = 0; }                   // 上下走 → 正面
      var nx = x + vx * SPEED * dt;
      if (!SceneCore.collides(nx, y, 5)) { x = nx; }
      var ny = y + vy * SPEED * dt;
      if (!SceneCore.collides(x, ny, 5)) { y = ny; }
    } else {
      dir = 0;                              // 不操作 → 正面朝我
    }
    /* 刚从静止开始走，偶尔喵一声 */
    if (moving && !wasMoving && Math.random() < 0.15) {
      Bubble.show(MEOWS[Math.floor(Math.random() * MEOWS.length)], 1400);
    }
    wasMoving = moving;
  }
  function state() { return { x: x, y: y, dir: dir, moving: moving }; }
  return { spawn: spawn, setKey: setKey, update: update, state: state };
})();

/* ================= SRC: CHARACTER RENDERER（表现层：Sprite Sheet 优先，无图回退程序化小猫） ================= */
var CharacterRenderer = (function () {
  var ASSET_ID = "player_cat";
  var P = { body: "#e8934a", cream: "#f6efe0", pink: "#f2a2b0", dark: "#2b2b3d" };

  function draw(ctx, st, time) {
    var w = 16, h = 16;
    if (Assets.isLoaded(ASSET_ID) && Assets.image(ASSET_ID)) {
      var spec = Assets.get(ASSET_ID);
      if (spec.size) { w = spec.size[0]; h = spec.size[1]; }
      /* dirFrames: 每方向一个帧索引数组（行=方向的旧布局也兼容）。
         站立时用该方向首帧；移动时按 fps 循环。 */
      var dirFrames = spec.dirFrames || { 0: [0], 1: [0], 2: [0], 3: [0] };
      var arr = dirFrames[st.dir] || dirFrames[0];
      var idx = st.moving ? arr[Math.floor(time * (spec.fps || 8)) % arr.length] : arr[0];
      /* sheet 里只有朝左帧，右走时水平翻转 */
      var flipH = (st.dir === 2);
      Assets.draw(ctx, ASSET_ID, Math.round(st.x - w / 2), Math.round(st.y - h / 2), w, h, idx, flipH);
      return;
    }
    drawFallback(ctx, st, time);
  }

  function drawFallback(ctx, st, time) {
    var bob = (st.moving && Math.floor(time * 4.5) % 2 === 1) ? 1 : 0;
    function px(ox, oy, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(st.x - 8 + ox), Math.round(st.y - 8 + oy), w, h); }
    if (st.dir === 2 || st.dir === 3) {
      px(st.dir === 2 ? 1 : 13, 5 + bob, 3, 7, P.body);
      px(st.dir === 2 ? 1 : 13, 11 + bob, 3, 2, "#1e1e2f");
    } else {
      px(12, 6 + bob, 3, 6, P.body);
      px(12, 11 + bob, 3, 2, "#1e1e2f");
    }
    px(4, 7 + bob, 8, 8, P.body);
    px(5, 10 + bob, 6, 5, P.cream);
    var ly = 13 + bob;
    if (st.moving && Math.floor(time * 4.5) % 2 === 1) {
      px(5, ly - 1, 2, 3, P.cream); px(9, ly, 2, 3, P.cream);
    } else {
      px(5, ly, 2, 3, P.cream); px(9, ly - 1, 2, 3, P.cream);
    }
    px(4, 0 + bob, 8, 7, P.body);
    px(4, 1 + bob, 1, 1, P.pink); px(11, 1 + bob, 1, 1, P.pink);
    if (st.dir === 1) {
      px(6, 2 + bob, 4, 4, P.body);
    } else {
      px(5, 3 + bob, 2, 2, P.dark); px(9, 3 + bob, 2, 2, P.dark);
      px(5, 3 + bob, 1, 1, "#fff"); px(9, 3 + bob, 1, 1, "#fff");
      px(7, 5 + bob, 2, 1, P.pink);
      px(6, 6 + bob, 1, 1, P.dark); px(9, 6 + bob, 1, 1, P.dark);
    }
  }
  return { draw: draw };
})();

/* ================= SRC: DIALOGUE（信件推进：分段 + 打字机 + 触发分发，逻辑不变） ================= */
var Dialogue = (function () {
  var segs = LETTER.segments, index = 0, typing = false, timer = null;
  var waiting = null; /* 当前等待的热区 id，玩家收集完后解除 */
  var textEl, barEl, nextEl;
  function init() {
    textEl = document.getElementById("dtext");
    barEl = document.getElementById("dbarfill");
    nextEl = document.getElementById("dnext");
  }
  function start() { index = 0; show(); }
  function show() {
    if (index >= segs.length) { Ending.show(); return; }
    var s = segs[index];
    clearInterval(timer);
    textEl.textContent = "";
    nextEl.style.display = "none";
    waiting = null;
    typing = true;
    var i = 0;
    timer = setInterval(function () {
      i++;
      textEl.textContent = s.text.slice(0, i);
      if (i >= s.text.length) {
        clearInterval(timer); typing = false;
        onTyped();
      }
    }, 26);
    barEl.style.width = (((index + 1) / segs.length) * 100).toFixed(1) + "%";
    /* 场景切换：读到带 scene 的段，换背景图和比例 */
    if (s.scene) {
      MapRenderer.switchScene(s.scene.asset);
      var cw = document.getElementById("canvaswrap");
      if (cw) { cw.style.aspectRatio = s.scene.aspect; }
    }
    triggerMemory(s);
  }
  function onTyped() {
    var s = segs[index];
    /* 暂停点：等玩家探索对应热区 */
    if (s.pauseAt && !Hotspots.isCollected(s.pauseAt)) {
      waiting = s.pauseAt;
      nextEl.style.display = "none";
      Bubble.show("跟我来", 2500);
      Hotspots.highlightOnly(s.pauseAt);
      return;
    }
    nextEl.style.display = "block";
  }
  function triggerMemory(s) {
    if (!s.memory) { return; }
    var m = MEMORIES[s.memory]; if (!m) { return; }
    if (Triggers.isCollected(m.id)) { return; }
    var pr = m.presentation;
    if (m.trigger.type === "scene") {
      Triggers.activateScene(m.id);
      if (pr.hintText) { Bubble.show(pr.hintText, 3400); }
      if (pr.barText) { SceneHint.show(pr.barText); }
    } else if (m.trigger.type === "drop") {
      MemoryDrop.spawn(m);
      if (pr.hintText) { Bubble.show(pr.hintText, 3400); }
      if (pr.barText) { SceneHint.show(pr.barText); }
    }
  }
  function finishType() {
    if (!typing) { return; }
    clearInterval(timer); typing = false;
    textEl.textContent = segs[index].text;
    onTyped();
  }
  function advance() {
    if (index >= segs.length) { return; }
    if (waiting) { return; } /* 等待探索中，不推进 */
    if (typing) { finishType(); AudioManager.click(); return; }
    index++;
    show();
    AudioManager.click();
  }
  /* Hotspots 收集完对应热区后调用：解锁信件 */
  function resume(hotspotId) {
    if (waiting === hotspotId) {
      waiting = null;
      Hotspots.highlightOnly(null);
      nextEl.style.display = "block";
    }
  }
  return { init: init, start: start, advance: advance, resume: resume };
})();

/* ================= SRC: MEMORY DROP（掉落物理不变；物件渲染走 Assets，无图回退程序化桃子） ================= */
var MemoryDrop = (function () {
  var item = null, bingoEl;
  function init() { bingoEl = document.getElementById("bingo"); }
  function spawn(mem) {
    if (item) { return; }
    var at = (mem.trigger && typeof mem.trigger.at === "number") ? mem.trigger.at : 0.5;
    item = { mem: mem, x: Math.round(SceneCore.W * SceneCore.TILE * at), y: -12, vy: 0, state: "fall", bounces: 0, t: 0 };
    if (bingoEl) {
      bingoEl.style.left = (item.x / (SceneCore.W * SceneCore.TILE) * 100) + "%";
      bingoEl.style.top = "30%";
      bingoEl.style.display = "block";
      bingoEl.style.animation = "none";
      void bingoEl.offsetWidth;
      bingoEl.style.animation = "bingoanim 1.5s ease-out forwards";
    }
    AudioManager.drop();
  }
  function update(dt) {
    if (!item) { return; }
    item.t += dt;
    if (item.state === "fall" || item.state === "bounce") {
      item.vy += 460 * dt;
      item.y += item.vy * dt;
      var floorY = SceneCore.H * SceneCore.TILE - 20;
      if (item.y >= floorY) {
        item.y = floorY;
        if (item.state === "fall") {
          item.state = "bounce"; item.vy = -item.vy * 0.38; item.bounces = 1;
        } else {
          item.bounces++;
          if (item.bounces >= 2) {
            item.vy = 0; item.state = "settle";
            if (item.mem.presentation.hintText) { Bubble.show(item.mem.presentation.hintText, 3400); }
          } else {
            item.vy = -item.vy * 0.38;
          }
        }
      }
    }
  }
  function draw(ctx) {
    if (!item) { return; }
    var a = 0.25 + 0.2 * Math.sin(item.t * 4);
    ctx.fillStyle = "rgba(255,209,102," + a.toFixed(2) + ")";
    ctx.fillRect(item.x - 14, item.y - 14, 28, 28);
    var id = item.mem.presentation.assetId;
    var w = 28, h = 28;
    var spec = Assets.get(id);
    if (spec && spec.size) { w = spec.size[0]; h = spec.size[1]; }
    if (Assets.isLoaded(id) && Assets.image(id)) {
      Assets.draw(ctx, id, item.x - w / 2, item.y - h / 2, w, h, 0);
    } else {
      drawPeach(ctx, Math.round(item.x), Math.round(item.y));
    }
  }
  function drawPeach(ctx, cx, cy) {
    for (var yy = 0; yy < 14; yy++) {
      var t = (yy - 6.5) / 6.5;
      var w = Math.round(6.5 * Math.sqrt(Math.max(0, 1 - t * t)));
      ctx.fillStyle = yy < 3 ? "#ffd9a0" : (yy < 10 ? "#f7b267" : "#e8934a");
      ctx.fillRect(cx - w, cy - 7 + yy, w * 2, 1);
    }
    ctx.fillStyle = "#d98e4a"; ctx.fillRect(cx - 1, cy - 6, 1, 12);
    ctx.fillStyle = "#7a4a21"; ctx.fillRect(cx, cy - 8, 2, 3);
    ctx.fillStyle = "#6b9e4f"; ctx.fillRect(cx - 4, cy - 9, 6, 2);
    ctx.fillStyle = "#4a7a36"; ctx.fillRect(cx - 4, cy - 8, 1, 2);
  }
  function hitTest(px, py) {
    if (!item || item.state !== "settle") { return false; }
    var dx = px - item.x, dy = py - item.y;
    return (dx * dx + dy * dy) < 18 * 18;
  }
  function collect() {
    if (!item) { return; }
    var m = item.mem;
    item = null;
    Popup.open(m, function () { Triggers.markCollected(m.id); SceneHint.hide(); });
  }
  function reset() { item = null; if (bingoEl) { bingoEl.style.display = "none"; } }
  return { init: init, spawn: spawn, update: update, draw: draw, hitTest: hitTest, collect: collect, reset: reset };
})();

/* ================= SRC: POPUP（弹窗控制器 + 模板注册表：内容与长相分离，模板可扩展） ================= */
var Popup = (function () {
  var root, onCloseCb = null;
  var templates = {};

  function init() {
    root = document.getElementById("popup");
    document.getElementById("pclose").addEventListener("click", close);
  }

  /* 模板注册表：表现层可扩展。以后加"卡片""多图翻页""动画+文字"等，
     只需 Popup.registerTemplate("gallery", renderer)，开合/回调/触发逻辑零改动。 */
  function registerTemplate(name, renderer) { templates[name] = renderer; }

  function open(memory, onClose) {
    var tpl = templates[memory.presentation.template] || templates["default"];
    tpl(root, memory);
    onCloseCb = onClose || null;
    root.classList.remove("hidden");
    AudioManager.popupOpen();
  }
  function close() {
    if (!root.classList.contains("hidden")) {
      root.classList.add("hidden");
      AudioManager.popupClose();
      var cb = onCloseCb; onCloseCb = null;
      if (cb) { cb(); }
    }
  }
  function isOpen() { return root && !root.classList.contains("hidden"); }
  function reset() { if (root) { root.classList.add("hidden"); } onCloseCb = null; }
  return { init: init, registerTemplate: registerTemplate, open: open, close: close, isOpen: isOpen, reset: reset };
})();

/* ================= SRC: BUBBLE（小猫的气泡提示） ================= */
var Bubble = (function () {
  var el, hideAt = 0;
  function init() { el = document.getElementById("catbubble"); }
  function show(text, ms) {
    if (!el) { return; }
    el.textContent = text;
    el.classList.add("show");
    hideAt = performance.now() + (ms || 3000);
    AudioManager.bubble();
  }
  function tick() {
    if (!el || !el.classList.contains("show")) { return; }
    var wrap = document.getElementById("canvaswrap");
    var w = wrap.clientWidth, h = wrap.clientHeight;
    var p = Player.state();
    el.style.left = (p.x / (SceneCore.W * SceneCore.TILE) * w) + "px";
    el.style.top = (p.y / (SceneCore.H * SceneCore.TILE) * h - 26) + "px";
    if (performance.now() > hideAt) { el.classList.remove("show"); }
  }
  function hide() { if (el) { el.classList.remove("show"); } }
  return { init: init, show: show, tick: tick, hide: hide };
})();

/* ================= SRC: HOTSPOTS（画面热区：可点击物件 + 对白 + 照片浮层） ================= */
var Hotspots = (function () {
  var collected = {};
  var current = null;
  var focus = null; /* 信件暂停时，只强闪这一个热区 */
  var pop, hsinner, hstext, hsclose, hsphoto, arrow;

  function list() {
    return SCENES.classroom.data.hotspots || [];
  }
  function init() {
    pop = document.getElementById("hotspotpop");
    hsinner = document.getElementById("hsinner");
    hstext = document.getElementById("hstext");
    hsclose = document.getElementById("hsclose");
    hsphoto = document.getElementById("hsphoto");
    arrow = document.getElementById("hsarrow");
    hsclose.addEventListener("click", function (e) { e.stopPropagation(); closeDialog(); });
    pop.addEventListener("click", function (e) { e.stopPropagation(); });
  }
  function isCollected(id) { return !!collected[id]; }
  function highlightOnly(id) { focus = id; }
  function allCollected() {
    return list().every(function (hs) { return collected[hs.id]; });
  }
  function draw(ctx, time) {
    list().forEach(function (hs) {
      var isFocus = (focus === hs.id);
      /* focus 模式下只闪目标；否则闪所有未收集的 */
      if (focus && !isFocus) { return; }
      if (!focus && collected[hs.id]) { return; }
      var speed = isFocus ? 0.9 : 1.6;
      var phase = (time + (hs.x % 7)) % speed;
      if (phase < speed * 0.6) {
        var cx = hs.x + hs.w / 2, cy = hs.y + hs.h / 2;
        var a = 1 - phase / (speed * 0.6);
        ctx.save();
        ctx.globalAlpha = a * (isFocus ? 0.45 : 0.25);
        ctx.fillStyle = isFocus ? "#ffd0e0" : "#ffe9a3";
        ctx.beginPath(); ctx.arc(cx, cy, isFocus ? 20 : 14, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.6 + a * 0.4;
        ctx.fillStyle = isFocus ? "#fff0f4" : "#fff3c4";
        var s = (isFocus ? 6 : 4) + a * (isFocus ? 3 : 2);
        ctx.beginPath();
        ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 0.35, cy - s * 0.35);
        ctx.lineTo(cx + s, cy); ctx.lineTo(cx + s * 0.35, cy + s * 0.35);
        ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s * 0.35, cy + s * 0.35);
        ctx.lineTo(cx - s, cy); ctx.lineTo(cx - s * 0.35, cy - s * 0.35);
        ctx.closePath(); ctx.fill();
        /* focus 模式下：画一个跳动的手指向下指 */
        if (isFocus) {
          var bounce = Math.sin(time * 5) * 4;
          ctx.globalAlpha = 0.95;
          ctx.fillStyle = "#fff";
          ctx.font = "16px monospace";
          ctx.fillText("👇", cx - 5, cy - 24 + bounce);
        }
        ctx.restore();
      }
    });
    if (allCollected()) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(time * 3) * 0.3;
      ctx.fillStyle = "#b8e986";
      ctx.font = "10px monospace";
      ctx.fillText("→ 出门", 24, 250);
      ctx.restore();
    }
  }
  function hitTest(x, y) {
    var PAD = 16; /* 手机端手指点不准，热区外扩 16px */
    for (var i = 0; i < list().length; i++) {
      var hs = list()[i];
      if (focus && hs.id !== focus) { continue; }
      if (x >= hs.x - PAD && x <= hs.x + hs.w + PAD && y >= hs.y - PAD && y <= hs.y + hs.h + PAD) { return hs; }
    }
    return null;
  }
  function openDialog(hs) {
    collected[hs.id] = true;
    current = hs;
    hstext.textContent = hs.dialog;
    if (hs.photos && hs.photos.length) {
      var img = Assets.image(hs.photos[0]);
      if (img) {
        hsphoto.src = img.src;
        hsphoto.style.display = "block";
        hsinner.style.background = "#ffeef4";
        hsinner.style.border = "2px solid #f4a7b9";
      }
    } else {
      hsphoto.style.display = "none";
      hsinner.style.background = "#fff";
      hsinner.style.border = "2px solid #3a2d22";
    }
    var cx = hs.x + hs.w / 2, cy = hs.y + hs.h / 2;
    var pctX = cx / 480 * 100;
    pop.style.left = Math.max(22, Math.min(78, pctX)) + "%";
    pop.style.transform = "translateX(-50%)";
    if (cy < 140) {
      pop.style.top = (cy + hs.h / 2 + 10) / 288 * 100 + "%";
      pop.style.bottom = "auto";
      arrow.style.cssText = "top:-7px;left:50%;border:7px solid transparent;border-bottom-color:" + (hs.photos ? "#f4a7b9" : "#3a2d22") + ";";
    } else {
      pop.style.bottom = (288 - (cy - hs.h / 2) + 10) / 288 * 100 + "%";
      pop.style.top = "auto";
      arrow.style.cssText = "bottom:-7px;left:50%;border:7px solid transparent;border-top-color:" + (hs.photos ? "#f4a7b9" : "#3a2d22") + ";";
    }
    pop.style.display = "block";
    AudioManager.bubble();
  }
  function closeDialog() {
    current = null;
    pop.style.display = "none";
    /* 关闭弹窗后，如果是信件暂停点，解锁信件 */
    if (focus) { Dialogue.resume(focus); }
  }
  function isOpen() { return !!current; }
  function onClick(x, y) {
    if (current) { return false; }
    var hs = hitTest(x, y);
    if (!hs) { return false; }
    /* 相框热区：直接用粉色 Popup */
    if (hs.id === "photo") {
      collected[hs.id] = true;
      Popup.open(MEMORIES.memory_photo, function () {
        if (focus === "photo") { Dialogue.resume("photo"); }
      });
      return true;
    }
    openDialog(hs);
    return true;
  }
  return {
    init: init, draw: draw, hitTest: hitTest, onClick: onClick,
    closeDialog: closeDialog, isOpen: isOpen, allCollected: allCollected,
    isCollected: isCollected, highlightOnly: highlightOnly
  };
})();

/* ================= SRC: FULL LETTER（完整的一封信，随时可读） ================= */
var FullLetter = (function () {
  var root;
  function init() {
    root = document.getElementById("fullletter");
    document.getElementById("ftext").textContent = LETTER.fullText;
    document.getElementById("fclose").addEventListener("click", close);
  }
  function show() { root.classList.remove("hidden"); }
  function close() { root.classList.add("hidden"); }
  function isOpen() { return root && !root.classList.contains("hidden"); }
  return { init: init, show: show, close: close, isOpen: isOpen };
})();

/* ================= SRC: ENDING（信读完的结尾） ================= */
var Ending = (function () {
  var root;
  function init() {
    root = document.getElementById("ending");
    document.getElementById("eLetter").addEventListener("click", function () {
      root.classList.add("hidden");
      FullLetter.show();
    });
    document.getElementById("eAgain").addEventListener("click", restart);
  }
  function show() { root.classList.remove("hidden"); }
  function isOpen() { return root && !root.classList.contains("hidden"); }
  function restart() {
    root.classList.add("hidden");
    Triggers.reset();
    MemoryDrop.reset();
    Popup.reset();
    Bubble.hide();
    SceneHint.hide();
    Player.spawn(SceneCore.spawn().x, SceneCore.spawn().y);
    Dialogue.start();
  }
  return { init: init, show: show, isOpen: isOpen };
})();

/* ================= SRC: SCENE HINT（画布顶部的记忆提示条） ================= */
var SceneHint = (function () {
  var el;
  function init() { el = document.getElementById("scenehint"); }
  function show(text) {
    if (!el) { return; }
    el.textContent = text;
    el.classList.remove("hidden");
  }
  function hide() { if (el) { el.classList.add("hidden"); } }
  return { init: init, show: show, hide: hide };
})();

/* ================= SRC: MAIN（启动 + 输入 + 主循环；素材注册与加载） ================= */
(function () {
  var canvas = document.getElementById("scene"), ctx = canvas.getContext("2d");
  var last = 0;

  /* ---- 素材注册（语义 ID → 资源描述）。缺文件自动回退程序化占位，不动逻辑。 ---- */
  Assets.register({ id: "map_classroom", kind: "image", src: "assets/maps/map_classroom.png" });
  Assets.register({ id: "map_train", kind: "image", src: "assets/maps/test_A_train.png" });
  Assets.register({ id: "map_building", kind: "image", src: "assets/maps/test_B_building.png" });
  Assets.register({ id: "map_sakura", kind: "image", src: "assets/maps/test_C_sakura.png" });
  Assets.register({
    id: "player_cat", kind: "sprite", src: "assets/characters/player_cat.png",
    frameW: 256, frameH: 256, frames: [4, 4], fps: 4, size: [56, 56],
    dirFrames: { 0: [0, 1], 1: [0, 1], 2: [6, 7], 3: [14, 15] }
  });
  Assets.register({ id: "memory_peach", kind: "image", src: "assets/memory-objects/memory_peach.png", size: [28, 28] });
  Assets.register({ id: "memory_textbook", kind: "image", src: "assets/memory-objects/memory_textbook.png", size: [32, 32] });
  Assets.register({ id: "memory_content_peach_01", kind: "image", src: "assets/memory-content/memory_peach_01.jpg" });
  Assets.register({ id: "photo_panda", kind: "image", src: "assets/memory-content/photo_panda.jpg" });
  Assets.register({ id: "photo_group", kind: "image", src: "assets/memory-content/photo_group.jpg" });
  /* 预留素材槽（接口示例，后续需要时接入渲染即可，不改逻辑）：
     effect_rain → assets/effects/effect_rain.gif（或 sprite / sequence / video / procedural）
     ui_dialogue → assets/ui/ui_dialogue.png
     ui_popup    → assets/ui/ui_popup.png
     bgm_scene   → assets/audio/bgm_scene.mp3（经 AudioManager.setMusic 接入） */
  ["map_classroom", "player_cat", "memory_peach", "memory_textbook", "memory_content_peach_01", "photo_panda", "photo_group"].forEach(function (id) {
    Assets.load(id);
  });

  function toInternal(e) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * canvas.width,
      y: (e.clientY - r.top) / r.height * canvas.height
    };
  }
  function overlayBusy() {
    return Popup.isOpen() || FullLetter.isOpen() || Ending.isOpen();
  }

  var KEYMAP = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };
  document.addEventListener("keydown", function (e) {
    AudioManager.init();
    if (KEYMAP[e.key]) { Player.setKey(KEYMAP[e.key], true); e.preventDefault(); return; }
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (Popup.isOpen()) { Popup.close(); return; }
      if (FullLetter.isOpen()) { FullLetter.close(); return; }
      if (Ending.isOpen()) { return; }
      Dialogue.advance();
    }
    if (e.key === "Escape") {
      if (Popup.isOpen()) { Popup.close(); }
      if (FullLetter.isOpen()) { FullLetter.close(); }
    }
  });
  document.addEventListener("keyup", function (e) {
    if (KEYMAP[e.key]) { Player.setKey(KEYMAP[e.key], false); }
  });

  canvas.addEventListener("click", function (e) {
    AudioManager.init();
    var p = toInternal(e);
    if (Hotspots.onClick(p.x, p.y)) { return; }
    if (MemoryDrop.hitTest(p.x, p.y)) { MemoryDrop.collect(); return; }
  });

  document.getElementById("dialogue").addEventListener("click", function () {
    AudioManager.init();
    if (overlayBusy()) { return; }
    Dialogue.advance();
  });

  var btnMute = document.getElementById("btnMute");
  var icoOn = document.getElementById("icoOn"), icoOff = document.getElementById("icoOff");
  btnMute.addEventListener("click", function () {
    AudioManager.init();
    var m = !AudioManager.isMuted();
    AudioManager.setMuted(m);
    icoOn.classList.toggle("hidden", m);
    icoOff.classList.toggle("hidden", !m);
  });
  document.getElementById("btnLetter").addEventListener("click", function () {
    AudioManager.init();
    FullLetter.show();
  });

  /* 触屏虚拟方向键（手机端） */
  var dpadBtns = { up: "dp-up", down: "dp-down", left: "dp-left", right: "dp-right" };
  Object.keys(dpadBtns).forEach(function (d) {
    var b = document.getElementById(dpadBtns[d]);
    function press(e) { e.preventDefault(); AudioManager.init(); Player.setKey(d, true); b.classList.add("active"); }
    function release() { Player.setKey(d, false); b.classList.remove("active"); }
    b.addEventListener("pointerdown", press);
    b.addEventListener("pointerup", release);
    b.addEventListener("pointercancel", release);
    b.addEventListener("pointerleave", release);
  });

  function loop(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;
    Player.update(dt);
    /* 猫走到光点附近自动触发对白 */
    if (!Hotspots.isOpen()) {
      var ps = Player.state();
      var hs = Hotspots.hitTest(ps.x, ps.y);
      if (hs) { Hotspots.onClick(ps.x, ps.y); }
    }
    MemoryDrop.update(dt);
    Bubble.tick();
    ctx.fillStyle = "#171a26";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    MapRenderer.draw(ctx, ts / 1000, Triggers.activeScene());
    Hotspots.draw(ctx, ts / 1000);
    MemoryDrop.draw(ctx);
    CharacterRenderer.draw(ctx, Player.state(), ts / 1000);
    requestAnimationFrame(loop);
  }

  AudioManager.init();
  Popup.init(); MemoryDrop.init(); Bubble.init(); Dialogue.init(); FullLetter.init(); Ending.init(); SceneHint.init(); Hotspots.init();
  Player.spawn(SceneCore.spawn().x, SceneCore.spawn().y);
  /* 开场遮罩：点击后才开始 */
  var ov = document.getElementById("startoverlay");
  ov.addEventListener("click", function () {
    AudioManager.init();
    ov.style.display = "none";
    Dialogue.start();
  }, { once: true });
  requestAnimationFrame(function (ts) { last = ts; requestAnimationFrame(loop); });
})();
</script>
</body>
